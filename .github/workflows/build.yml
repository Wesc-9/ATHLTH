name: Build ATHLTH

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - restore/v1-athlth-plus
      - release/v1.2
      - release/v1.3
      - release/v1.3.1
      - release/v1.3.2
      - release/v1.3.3
      - release/v1.3.4
      - release/v1.3.8
      - release/v1.3.9
      - release/v1.4.0
      - release/v1.4.1
      - release/v1.4.2
    paths:
      - .github/build-trigger
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify approved app icons
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ICON_BLOB="e4846875813cad789aaf6b694a30d861e1af1d5a"
          ICONS=(
            ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png
            ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png
            ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png
            ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          )

          for icon in "${ICONS[@]}"; do
            test -s "$icon"
            ACTUAL_BLOB=$(git hash-object "$icon")
            if [ "$ACTUAL_BLOB" != "$EXPECTED_ICON_BLOB" ]; then
              echo "::error::Unexpected ATHLTH app icon at $icon ($ACTUAL_BLOB)"
              exit 1
            fi

            WIDTH=$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')
            HEIGHT=$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')
            if [ "$WIDTH" != "1024" ] || [ "$HEIGHT" != "1024" ]; then
              echo "::error::App icon must be 1024x1024: $icon is ${WIDTH}x${HEIGHT}"
              exit 1
            fi
          done

          echo "Approved flat ATHLTH icon verified for iPhone, dark, tinted and Watch assets."

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
