name: ATHLTH
options:
  bundleIdPrefix: com.wesc9
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "23"
    DEVELOPMENT_TEAM: D3AX7B6RMW
targets:
  ATHLTH:
    type: application
    platform: iOS
    sources:
      - path: ATHLTH
      - path: Shared
    dependencies:
      - target: ATHLTHWatchApp
        embed: true
      - package: Supabase
    info:
      path: ATHLTH/Resources/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: "ATHLTH reads workouts, sleep, heart rate, activity and related Health data to provide your training history, recovery insights and workout metrics."
        NSHealthUpdateUsageDescription: "ATHLTH saves workouts and related training data to Apple Health so workouts recorded with ATHLTH and Apple Watch stay in sync."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.wesc9.athlth.auth
            CFBundleURLSchemes:
              - athlth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth
        PRODUCT_NAME: ATHLTH
        CODE_SIGN_ENTITLEMENTS: ATHLTH/Resources/ATHLTH.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

  ATHLTHWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ATHLTHWatchApp
      - path: ATHLTHWatchExtension
        excludes:
          - Info.plist
          - ATHLTHWatchExtension.entitlements
      - path: Shared
    info:
      path: ATHLTHWatchExtension/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wesc9.athlth
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: "ATHLTH reads live heart rate, energy, distance and workout data to show your training metrics on Apple Watch."
        NSHealthUpdateUsageDescription: "ATHLTH saves workouts and workout routes from Apple Watch to Apple Health so your training history stays complete."
        NSLocationWhenInUseUsageDescription: "ATHLTH uses your location during outdoor workouts to record distance and your workout route."
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.watchkitapp
        PRODUCT_NAME: ATHLTH
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Finalize single-target Watch Info.plist
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :WKApplication true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKApplication bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.wesc9.athlth" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKCompanionAppBundleIdentifier string com.wesc9.athlth" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :WKRunsIndependentlyOfCompanionApp false" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKRunsIndependentlyOfCompanionApp bool false" "$PLIST"
