concurrency:
  group: athlth-train-hybrid-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hybrid-xctest:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen and tools
        run: |
          brew install xcodegen
          brew install imagemagick

      - name: Cache public SwiftPM repository objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ATHLTHSourcePackages/repositories
          key: swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare simulator build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/optimize_hero_assets.sh
          python3 scripts/prepare_repdb_offline.py
          cp project.yml project-hybrid-tests.yml
          python3 - project-hybrid-tests.yml <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          contents = path.read_text()
          contents = contents.replace(
              "      - target: ATHLTHWatchApp\n        embed: true\n", ""
          )
          path.write_text(contents)
          PY
          xcodegen generate --spec project-hybrid-tests.yml

      - name: Run targeted hybrid regression tests on iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_MATRIX="$RUNNER_TEMP/athlth-test-simulators.txt"
          DEVICE_JSON="$RUNNER_TEMP/athlth-test-registered-devices.json"
          xcrun simctl list devices available -j > "$DEVICE_JSON"
          python3 scripts/select_iphone_simulators.py < "$DEVICE_JSON" > "$DEVICE_MATRIX"
          test -s "$DEVICE_MATRIX"
          # Create a job-owned device using an actually registered runtime/type
          # pair; never reuse a pre-existing, potentially wedged simulator.
          python3 - "$DEVICE_JSON" "$DEVICE_MATRIX" <<'PY' > "$RUNNER_TEMP/athlth-test-device-types.txt"
          import json, pathlib, sys
          devices = json.loads(pathlib.Path(sys.argv[1]).read_text())["devices"]
          pairs = {
              d["udid"]: (runtime, d.get("deviceTypeIdentifier"))
              for runtime, entries in devices.items() for d in entries
              if d.get("udid")
          }
          for row in pathlib.Path(sys.argv[2]).read_text().splitlines():
              _, udid, label = row.split("|", 2)
              runtime, device_type = pairs[udid]
              if not device_type:
                  raise SystemExit(f"Missing device type for registered iPhone {label}")
              print(f"{runtime}|{device_type}|{label}")
          PY
          test -s "$RUNNER_TEMP/athlth-test-device-types.txt"
          UDID=""
          cleanup_simulator() {
            if [ -n "$UDID" ]; then
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
              UDID=""
            fi
          }
          trap cleanup_simulator EXIT
          simulator_ready=0
          while IFS='|' read -r runtime device_type label; do
            for attempt in 1 2 3; do
              echo "::group::Fresh hybrid simulator: $label, attempt $attempt/3"
              cleanup_simulator
              if UDID=$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl create "ATHLTH-hybrid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt" "$device_type" "$runtime"); then
                if perl -e 'alarm shift; exec @ARGV' 90 xcrun simctl boot "$UDID"; then
                  # bootstatus may stall on a hosted runner even after launchd
                  # is responding. Require both Booted state and live services.
                  if ! perl -e 'alarm shift; exec @ARGV' 150 xcrun simctl bootstatus "$UDID" -b; then
                    echo "::warning::bootstatus stalled; checking actual device state and services."
                  fi
                  for probe in 1 2 3; do
                    if xcrun simctl list devices booted -j | python3 -c 'import json,sys; target=sys.argv[1]; sys.exit(0 if any(d.get("udid")==target and d.get("state")=="Booted" for group in json.load(sys.stdin)["devices"].values() for d in group) else 1)' "$UDID" &&
                       perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl spawn "$UDID" launchctl list >/dev/null; then
                      simulator_ready=1
                      break
                    fi
                    sleep 5
                  done
                fi
              else
                UDID=""
              fi
              if [ "$simulator_ready" -eq 1 ]; then
                echo "::notice::Fresh simulator ready: $UDID"
                echo "::endgroup::"
                break
              fi
              echo "::warning::Simulator infrastructure failure before XCTest; discarding this device."
              perl -e 'alarm shift; exec @ARGV' 25 xcrun simctl list devices 2>&1 | tail -60 || true
              echo "::endgroup::"
              cleanup_simulator
            done
            if [ "$simulator_ready" -eq 1 ]; then break; fi
          done < "$RUNNER_TEMP/athlth-test-device-types.txt"
          if [ "$simulator_ready" -ne 1 ]; then
            echo "::error::SIMULATOR_STARTUP_FAILURE: no fresh compatible iPhone simulator became ready; XCTest was not executed."
            exit 1
          fi
          # Run the complete targeted suite exactly once on the ready device.
          # A compile or XCTest failure must fail the job, never be retried as startup.
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ATHLTHSourcePackages" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -jobs 3 \
            -derivedDataPath "$RUNNER_TEMP/HybridDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HybridTests.xcresult" \
            -only-testing:ATHLTHTests/ATHLTHPlannedHybridLaunchTests \
            -only-testing:ATHLTHTests/ATHLTHHybridOutdoorRoutePolicyTests \
            -only-testing:ATHLTHTests/ATHLTHHybridWatchDistanceAnchorTests \
            -only-testing:ATHLTHTests/ATHLTHExploreRoutePolicyTests \
            -only-testing:ATHLTHTests/ATHLTHRouteDetailsPolicyTests \
            -only-testing:ATHLTHTests/ATHLTHRouteOfflineAndDirectionTests \
            -only-testing:ATHLTHTests/PublicRouteBrowseRegressionTests \
            -only-testing:ATHLTHTests/ATHLTHLibraryPaginationTests \
            -only-testing:ATHLTHTests/ATHLTHLibraryDisplayModeTests \
            -only-testing:ATHLTHTests/ATHLTHLibraryResponsiveLayoutTests \
            -only-testing:ATHLTHTests/ATHLTHPublicTrailDiskCacheTests \
            -only-testing:ATHLTHTests/ATHLTHLiveWorkoutEngineRouterTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutSessionFoundationTests \
            -only-testing:ATHLTHTests/ATHLTHUniversalActiveCaptureTests \
            -only-testing:ATHLTHTests/ATHLTHCustomWorkoutTimelineTests \
            -only-testing:ATHLTHTests/ATHLTHUnifiedActivityProfileTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutCaptureAdmissionTests \
            -only-testing:ATHLTHTests/ATHLTHManualTimedCaptureTests \
            -only-testing:ATHLTHTests/ATHLTHStructuredCaptureAdmissionTests \
            -only-testing:ATHLTHTests/WorkoutDeviceRelayClaimPolicyTests \
            -only-testing:ATHLTHTests/ATHLTHLiveWorkoutBottomModeTests \
            -only-testing:ATHLTHTests/ATHLTHStrengthAdvancedLiveSetTests \
            -only-testing:ATHLTHTests/ATHLTHStrengthGroupedSetTests \
            -only-testing:ATHLTHTests/StrengthSkipSetWatchTests \
            -only-testing:ATHLTHTests/ATHLTHiPadLiveWorkoutTests \
            -only-testing:ATHLTHTests/WorkoutLaunchHardeningTests \
            -only-testing:ATHLTHTests/StrengthTimedSetCountdownTests \
            -only-testing:ATHLTHTests/ATHLTHHybridStrengthSessionTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutHealthKitContinuityPolicyTests \
            -only-testing:ATHLTHTests/ATHLTHPhoneCompletionJournalTests \
            -only-testing:ATHLTHTests/ATHLTHUnifiedMixedWorkoutPlanTests \
            -only-testing:ATHLTHTests/StrengthActiveExerciseQueueTests \
            -only-testing:ATHLTHTests/ATHLTHRecordedWorkoutIndexTests \
            -only-testing:ATHLTHTests/ATHLTHPlannedWorkoutPresentationTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutTimelineOverviewTests \
            -only-testing:ATHLTHTests/ATHLTHIntervalGroupEditingTests \
            -only-testing:ATHLTHTests/ATHLTHRunningTargetEditingTests \
            -only-testing:ATHLTHTests/ATHLTHDetailedIntervalBuilderTests \
            -only-testing:ATHLTHTests/ATHLTHPlanCreationDraftTests \
            -only-testing:ATHLTHTests/TrainingPlanCatalogSchedulingTests \
            -only-testing:ATHLTHTests/ATHLTHTrainDesignLayoutTests \
            -only-testing:ATHLTHTests/ATHLTHTrainTodayLayoutTests \
            -only-testing:ATHLTHTests/ATHLTHTrainPlanStudioIntegrationTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutDurationEstimatorTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutPhaseRelocationTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutContentSummaryTests \
            -only-testing:ATHLTHTests/StrengthWorkoutCompletionRecoveryTests \
            -only-testing:ATHLTHTests/ATHLTHWorkoutMirrorContinuityTests \
            -only-testing:ATHLTHTests/ATHLTHWatchWorkoutOwnershipTests \
            -only-testing:ATHLTHTests/ATHLTHCompletedRunningPerformanceTests \
            -only-testing:ATHLTHTests/ATHLTHGuidanceStudioConfigurationTests \
            -only-testing:ATHLTHTests/ATHLTHAudioCoachRuleDeliveryTests \
            -only-testing:ATHLTHTests/ATHLTHCoachAdaptiveMotivationTests \
            -only-testing:ATHLTHTests/AudioCoachFreshnessAndReceiptTests \
            -only-testing:ATHLTHTests/AudioCoachVoiceRoutingTests \
            -only-testing:ATHLTHTests/ATHLTHAudioCoachSmartPromptsTests \
            -only-testing:ATHLTHTests/ATHLTHSpotifyIntervalCuePolicyTests \
            -only-testing:ATHLTHTests/ATHLTHSpotifySmartMusicTests \
            -only-testing:ATHLTHTests/SpotifyWorkoutAutoplayGateTests \
            -only-testing:ATHLTHTests/WorkoutSpotifyOverrideTests \
            -only-testing:ATHLTHTests/AudioCoachVoicePausePolicyTests \
            -only-testing:ATHLTHTests/ATHLTHAudioCoachPaceAndPRTests \
            -only-testing:ATHLTHTests/ATHLTHAudioCoachEventTriggerTests \
            -only-testing:ATHLTHTests/ATHLTHAudioCoachGroupMoveTests \
