name: Validate TestFlight pipeline without upload

on:
  workflow_dispatch:
  push:
    branches:
      - restore/v1-athlth-plus
    paths:
      - .github/workflows/release-dryrun.yml

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: D3AX7B6RMW
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive without creating development certificates
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Verify archived app structure and versions
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app"
          WATCH_APP="$IOS_APP/Watch/ATHLTH.app"
          test -d "$IOS_APP"
          test -d "$WATCH_APP"
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IOS_APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          IOS_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$IOS_APP/Info.plist")
          WATCH_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP/Info.plist")
          echo "iPhone: $IOS_VERSION ($IOS_BUILD)"
          echo "Watch:  $WATCH_VERSION ($WATCH_BUILD)"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_VERSION" = "$WATCH_VERSION"
          test "$IOS_BUILD" -gt 1

      - name: Create local export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA without uploading
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify exported IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$WATCH_APP"
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          echo "Exported iPhone CFBundleVersion: $IOS_BUILD"
          echo "Exported Watch CFBundleVersion: $WATCH_BUILD"
          test "$IOS_BUILD" = "$WATCH_BUILD"
