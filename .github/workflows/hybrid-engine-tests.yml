            -only-testing:ATHLTHTests/ATHLTHSimpleWorkoutOutlineTests \
            -only-testing:ATHLTHTests/ATHLTHPlanRefreshPerformanceTests \
            -only-testing:ATHLTHTests/PerformanceCache174Tests \
            -only-testing:ATHLTHTests/ATHLTHUnifiedQuickStartPresentationTests \
            -only-testing:ATHLTHTests/ATHLTHHomeWorkoutComposerRecoveryTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test result on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-train-hybrid-xcresult
          path: ${{ runner.temp }}/HybridTests.xcresult
          retention-days: 3
          if-no-files-found: ignore
  
  # The iPhone-only XCTest configuration removes the Watch embed target.
  # Compile the actual watchOS application as a separate release gate.
  watch-hybrid-build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
      - name: Cache public SwiftPM repository objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ATHLTHSourcePackages/repositories
          key: swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate full Watch project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build real ATHLTH Watch target for watchOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -target ATHLTHWatchApp \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ATHLTHSourcePackages" \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
