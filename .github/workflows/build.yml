concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Once TestFlight is requested, preserve same-commit iOS verification
  # despite follow-up development pushes to the active release branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/release/v1.8.8' && github.ref != 'refs/heads/release/v1.8.9' && github.ref != 'refs/heads/release/v2.0.2' }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Guard Insights tab routing and reference design
        run: python3 scripts/audit_insights_entrypoints.py
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Fast Swift syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # Parse every Swift target including unit tests and the actual
          # Watch extension. Syntax errors in Tests previously escaped this
          # preflight and wasted the long simulator XCTest build.
          roots = [
              Path("ATHLTH"), Path("ATHLTHWatchExtension"),
              Path("ATHLTHWatchWidgets"), Path("ATHLTHWidgets"),
              Path("Shared"), Path("Tests"),
          ]
          sources = sorted(
              str(source)
              for root in roots if root.is_dir()
              for source in root.rglob("*.swift")
          )
          if not sources:
              raise SystemExit("No Swift sources found for syntax preflight")

          # Syntax-only: no signing, simulator build, linked frameworks,
          # dependencies, or generated Xcode project needed.
          result = subprocess.run(
              ["xcrun", "swiftc", "-frontend", "-parse", *sources],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          if result.stdout:
              print(result.stdout)
          if result.returncode:
              raise SystemExit(
                  "Swift syntax preflight failed before Xcode build"
              )
          print(f"Swift syntax valid in {len(sources)} source files")
          PY

      - name: Audit Watch Always-On visual and power rules
        run: python3 scripts/audit_watch_visual_power.py

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate and validate approved app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icons.py
          python3 - <<'PY'
          from __future__ import annotations
          import struct
          import zlib
          from pathlib import Path

          icons = [
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png"),
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png"),
              Path("ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
          ]

          def validate(path: Path) -> bytes:
              payload = path.read_bytes()
              if payload[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path}: invalid PNG signature")
              offset = 8
              width = height = None
              saw_idat = saw_iend = False
              while offset + 12 <= len(payload):
                  length = struct.unpack(">I", payload[offset:offset + 4])[0]
                  kind = payload[offset + 4:offset + 8]
                  data_start = offset + 8
                  data_end = data_start + length
                  crc_end = data_end + 4
                  if crc_end > len(payload):
                      raise SystemExit(f"{path}: truncated PNG chunk {kind!r}")
                  data = payload[data_start:data_end]
                  expected_crc = struct.unpack(">I", payload[data_end:crc_end])[0]
                  if (zlib.crc32(kind + data) & 0xffffffff) != expected_crc:
                      raise SystemExit(f"{path}: CRC mismatch in {kind!r}")
                  if kind == b"IHDR":
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(">IIBBBBB", data)
                      if (width, height, bit_depth, color_type) != (1024, 1024, 8, 2):
                          raise SystemExit(
                              f"{path}: expected 1024x1024 8-bit RGB, got "
                              f"{width}x{height}, bit_depth={bit_depth}, color_type={color_type}"
                          )
                  elif kind == b"IDAT":
                      saw_idat = True
                  elif kind == b"IEND":
                      saw_iend = True
                      break
                  offset = crc_end
              if not (saw_idat and saw_iend):
                  raise SystemExit(f"{path}: incomplete PNG structure")
              return payload

          payloads = [validate(path) for path in icons]
          if any(payload != payloads[0] for payload in payloads[1:]):
              raise SystemExit("ATHLTH iPhone/dark/tinted/Watch icons do not match")
          print("ATHLTH app icons are valid 1024x1024 RGB PNGs.")
          PY

      - name: Check aspect-fill image bounds
        run: python3 scripts/check_aspect_fill_bounds.py

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Embed licensed RepDB catalog and images for offline use
        run: python3 scripts/prepare_repdb_offline.py

      - name: Generate Xcode project
        run: xcodegen generate
      # Keep the full iPhone and Watch build, but boot a compatible
      # registered iPhone before launching the hosted XCTest suite.
      - name: Test privacy, plan completion and account storage
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin).get("devices", {})
          devices = []
          for runtime, entries in data.items():
              match = re.search(r"iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.group(1).split("-")))
              for device in entries:
                  if device.get("isAvailable") is not False and device.get("name", "").startswith("iPhone"):
                      devices.append((version, device["udid"], device["name"]))
          if not devices:
              raise SystemExit("No installed compatible iPhone simulator for XCTest")
          version, identifier, name = max(devices, key=lambda x: x[0])
          print(identifier)
          print(f"::notice::Selected XCTest simulator {name} (iOS {version})", file=sys.stderr)
          ')
          echo "Booting XCTest host simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ATHLTH.xcodeproj -scheme ATHLTH \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath "$RUNNER_TEMP/ATHLTHTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Preserve XCTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-xctest-results
          path: ${{ runner.temp }}/ATHLTHTests.xcresult
          if-no-files-found: warn
          retention-days: 14
