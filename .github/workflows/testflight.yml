name: Upload ATHLTH to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.2
    paths:
      - .github/testflight-trigger

concurrency:
  group: athlth-testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testflight:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: D3AX7B6RMW
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive without creating development certificates
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Verify archived bundle versions
        shell: bash
        run: |
          set -euo pipefail
          IOS_PLIST="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app/Info.plist"
          WATCH_PLIST="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app/Watch/ATHLTH.app/Info.plist"
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IOS_PLIST")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_PLIST")
          echo "iPhone CFBundleVersion: $IOS_BUILD"
          echo "Watch CFBundleVersion: $WATCH_BUILD"
          if [ "$IOS_BUILD" -le 1 ] || [ "$WATCH_BUILD" -le 1 ]; then
            echo "::error::Both iPhone and Watch bundle versions must be greater than 1."
            exit 1
          fi
          if [ "$IOS_BUILD" != "$WATCH_BUILD" ]; then
            echo "::error::iPhone and Watch bundle versions must match."
            exit 1
          fi

      - name: Seed archive entitlements with ad-hoc signatures
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app"
          WATCH_APP="$IOS_APP/Watch/ATHLTH.app"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements" "$WATCH_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTH/Resources/ATHLTH.entitlements" "$IOS_APP"

      - name: Create validation export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ValidationExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export and validate signed IPA before upload
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/validation-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ValidationExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA=$(find "$RUNNER_TEMP/validation-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/validation-ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/validation-ipa"
          APP=$(find "$RUNNER_TEMP/validation-ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test -n "$WATCH_APP"

          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$WATCH_APP"

          IOS_ENT="$RUNNER_TEMP/validation-ios-entitlements.plist"
          WATCH_ENT="$RUNNER_TEMP/validation-watch-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$IOS_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WATCH_APP" > "$WATCH_ENT" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$WATCH_ENT" | grep -qx "true"

          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          IOS_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          WATCH_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP/Info.plist")
          echo "Validated iPhone: $IOS_VERSION ($IOS_BUILD)"
          echo "Validated Watch:  $WATCH_VERSION ($WATCH_BUILD)"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_VERSION" = "$WATCH_VERSION"
          test "$IOS_BUILD" -gt 1

      - name: Create upload export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Upload to App Store Connect / TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v1.2.0" \
            --target "$GITHUB_SHA" \
            --title "ATHLTH 1.2.0" \
            --notes-file - <<'EOF'
          ATHLTH 1.2.0

          - New cinematic onboarding and sign-in experience
          - Account deletion flow
          - Improved Apple Watch pairing and connection verification
          - Correct ATHLTH branding across iPhone and Apple Watch
          - ATHLTH+ foundation retained
          EOF

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-testflight-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/export
          if-no-files-found: ignore
