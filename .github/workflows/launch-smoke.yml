name: ATHLTH iPhone Compatibility Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
      - release/v1.4.4
      - release/v1.4.6
      - release/v1.5.1
      - release/v1.5.2
      - release/v1.5.3
      - release/v1.6.9
      - release/v1.7.2
      - release/v1.7.3
      - release/v1.7.4
      - release/v1.7.5
      - release/v1.7.6
      - release/v1.7.7
      - release/v1.7.8
      - release/v1.7.9
      - release/v1.8.0
      - release/v1.8.1
      - release/v1.8.2
      - release/v1.8.3
      - release/v1.8.8
      - release/v1.8.9
      - release/v1.9.0
      - release/v1.9.1
      - release/v1.9.2
      - release/v1.9.9
      - release/v2.0.0
      - release/v2.0.1
      - release/v2.0.2
      - release/v2.0.3
    paths:
      - ATHLTH/**/*.swift
      - ATHLTHWidgets/**/*.swift
      - Shared/ATHLTHBrandMark.swift
      - ATHLTH/Assets.xcassets/**
      - Shared/**/*.swift
      - project.yml
      - scripts/optimize_hero_assets.sh
      - .github/workflows/launch-smoke.yml
      - .github/workflows/hybrid-engine-tests.yml
      - Tests/ATHLTHPlannedHybridLaunchTests.swift
      - Tests/ATHLTHUnifiedMixedWorkoutPlanTests.swift
      - Tests/ATHLTHLiveWorkoutEngineRouterTests.swift
      - Tests/StrengthActiveExerciseQueueTests.swift
      - .github/launch-trigger

concurrency:
  group: athlth-iphone-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launch-smoke:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Verify Insights main-tab and preview routing
        run: python3 scripts/audit_insights_entrypoints.py

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install validation tools
        run: |
          brew install xcodegen
          brew install imagemagick

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Embed RepDB offline exercise assets
        run: python3 scripts/prepare_repdb_offline.py

      - name: Generate iPhone-only smoke-test project
        shell: bash
        run: |
          set -euo pipefail
          cp project.yml project-smoke.yml
          python3 - project-smoke.yml <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("      - target: ATHLTHWatchApp\n        embed: true\n", "")
          path.write_text(text)
          PY
          xcodegen generate --spec project-smoke.yml

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch across SE mini standard and large iPhones
        shell: bash
        run: |
          set -euo pipefail

          # The device-type catalog contains older phones that iOS 27 cannot
          # create. Select existing simulator UDIDs registered to compatible
          # runtimes instead; report classes unavailable on this runner.
          DEVICE_MATRIX="$RUNNER_TEMP/iphone-device-matrix.txt"
          xcrun simctl list devices available -j \
            | python3 scripts/select_iphone_simulators.py > "$DEVICE_MATRIX"
          test -s "$DEVICE_MATRIX"

          cat "$DEVICE_MATRIX"

          # The app was built in an earlier workflow step. Explicitly
          # resolve it in this shell; step-local variables are not inherited.
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name 'ATHLTH.app' -print -quit)
          test -n "$APP"
          test -d "$APP"

          cleanup_device() {
            local udid="$1"
            # These are registered runner-owned simulators, not temporary
            # devices created by this job. Never delete them.
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
          }

          validate_nonblank_screen() {
            local udid="$1"
            local screenshot="$2"
            local label="$3"
            local retry_mode="${4:-final}"
            local attempt=1
            local entropy="0"

            while [ "$attempt" -le 3 ]; do
              xcrun simctl io "$udid" screenshot "$screenshot"
              test -s "$screenshot"

              entropy=$(magick "$screenshot" -colorspace Gray -format "%[entropy]" info:)
              echo "$label screenshot entropy (attempt $attempt): $entropy"

              if python3 - "$entropy" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= 0.025 else 1)
          PY
              then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "$label still looks blank; waiting 8 seconds before retry."
                sleep 8
              fi

              attempt=$((attempt + 1))
            done

            if [ "$retry_mode" = "probe" ]; then
              echo "::warning::$label looks blank after initial checks (entropy=$entropy); relaunching once to distinguish a simulator rendering issue."
              return 1
            fi
            echo "::error::$label remained visually blank after relaunch and three more checks (entropy=$entropy)."
            xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
            return 1
          }

          while IFS='|' read -r CLASS DEVICE_UDID DEVICE_NAME; do
            echo "Testing $CLASS layout on $DEVICE_NAME"

            UDID="$DEVICE_UDID"
            trap 'cleanup_device "$UDID"' EXIT
            # Reuse the runner's already-compatible device/runtime pairing.
            # A previously booted device does not need a second boot.
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"

            set +e
            LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.wesc9.athlth 2>&1)
            LAUNCH_STATUS=$?
            set -e

            echo "$LAUNCH_OUTPUT"

            if [ "$LAUNCH_STATUS" -ne 0 ]; then
              echo "::error::ATHLTH failed to launch on $DEVICE_NAME."
              xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "ATHLTH"' || true
              exit 1
            fi

            PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
            sleep 8

            if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::ATHLTH exited shortly after launch on $DEVICE_NAME."
              xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
              exit 1
            fi

            SCREENSHOT="$RUNNER_TEMP/athlth-$CLASS.png"
            if ! validate_nonblank_screen "$UDID" "$SCREENSHOT" "$DEVICE_NAME onboarding" probe; then
              # A headless CoreSimulator framebuffer can remain blank even
              # after a successful process launch on a freshly created device.
              # Reopen the real app once; do not lower the visual threshold or
              # mark a persistently blank screen as a passing result.
              xcrun simctl terminate "$UDID" com.wesc9.athlth || true
              sleep 3
              set +e
              RETRY_LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.wesc9.athlth 2>&1)
              RETRY_LAUNCH_STATUS=$?
              set -e
              echo "$RETRY_LAUNCH_OUTPUT"
              if [ "$RETRY_LAUNCH_STATUS" -ne 0 ]; then
                echo "::error::ATHLTH failed to relaunch after blank screenshot on $DEVICE_NAME."
                exit 1
              fi
              PID=$(echo "$RETRY_LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
              sleep 12
              if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
                echo "::error::ATHLTH exited during blank-screen relaunch on $DEVICE_NAME."
                exit 1
              fi
              validate_nonblank_screen "$UDID" "$SCREENSHOT" "$DEVICE_NAME onboarding"
            fi

            echo "ATHLTH remained alive and rendered non-blank onboarding UI on $DEVICE_NAME (PID $PID)."

            xcrun simctl terminate "$UDID" com.wesc9.athlth || true

            for TAB in 0 1 2 3 4; do
              echo "Rendering main tab $TAB on $DEVICE_NAME"

              set +e
              TAB_LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.wesc9.athlth \
                --athlth-compatibility-preview \
                "--athlth-compatibility-tab=$TAB" 2>&1)
              TAB_LAUNCH_STATUS=$?
              set -e

              echo "$TAB_LAUNCH_OUTPUT"

              if [ "$TAB_LAUNCH_STATUS" -ne 0 ]; then
                echo "::error::ATHLTH tab $TAB failed to launch on $DEVICE_NAME."
                exit 1
              fi

              TAB_PID=$(echo "$TAB_LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
              sleep 5

              if [ -z "$TAB_PID" ] || ! kill -0 "$TAB_PID" 2>/dev/null; then
                echo "::error::ATHLTH tab $TAB exited on $DEVICE_NAME."
                xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
                exit 1
              fi

              TAB_SCREENSHOT="$RUNNER_TEMP/athlth-$CLASS-tab-$TAB.png"
              validate_nonblank_screen                 "$UDID"                 "$TAB_SCREENSHOT"                 "$DEVICE_NAME tab $TAB"

              xcrun simctl terminate "$UDID" com.wesc9.athlth || true
            done

            echo "All five main tabs rendered on $DEVICE_NAME."

            cleanup_device "$UDID"
            trap - EXIT
          done < "$DEVICE_MATRIX"

      - name: Upload iPhone smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-smoke-screenshots
          path: ${{ runner.temp }}/athlth-*.png
          if-no-files-found: warn
          retention-days: 3