name: Diagnose Apple signing resources

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
    paths:
      - .github/apple-signing-diagnostic-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect certificates profiles and bundle capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography

          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          import jwt

          raw_key = os.environ["ASC_API_KEY_P8"].strip()
          if len(raw_key) >= 2 and raw_key[0] == raw_key[-1] and raw_key[0] in {"'", '"'}:
              if raw_key[0] == '"':
                  try:
                      raw_key = json.loads(raw_key)
                  except json.JSONDecodeError:
                      raw_key = raw_key[1:-1]
              else:
                  raw_key = raw_key[1:-1]
          raw_key = raw_key.replace("\\r\\n", "\n").replace("\\n", "\n")

          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": now - 30,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              },
              raw_key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          def get(path, params=None):
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(payload)
                  except Exception:
                      body = {"raw": payload}
                  return exc.code, body

          print("=== CERTIFICATES ===")
          status, body = get("/v1/certificates", {
              "filter[certificateType]": "DISTRIBUTION",
              "limit": "200",
          })
          print(f"CERT_HTTP={status}")
          if status == 200:
              certs = body.get("data", [])
              print(f"DISTRIBUTION_CERT_COUNT={len(certs)}")
              for i, item in enumerate(certs):
                  a = item.get("attributes", {})
                  print(f"CERT[{i}].ID={item.get('id')}")
                  print(f"CERT[{i}].DISPLAY_NAME={a.get('displayName')}")
                  print(f"CERT[{i}].SERIAL={a.get('serialNumber')}")
                  print(f"CERT[{i}].PLATFORM={a.get('platform')}")
                  print(f"CERT[{i}].EXPIRATION={a.get('expirationDate')}")
                  print(f"CERT[{i}].TYPE={a.get('certificateType')}")
          else:
              print(json.dumps(body, sort_keys=True))

          bundle_ids = [
              "com.wesc9.athlth",
              "com.wesc9.athlth.widgets",
              "com.wesc9.athlth.watchkitapp",
          ]

          resolved = {}
          print("=== BUNDLE IDS / CAPABILITIES ===")
          for ident in bundle_ids:
              status, body = get("/v1/bundleIds", {
                  "filter[identifier]": ident,
                  "limit": "20",
              })
              print(f"BUNDLE_LOOKUP[{ident}].HTTP={status}")
              matches = [
                  item for item in body.get("data", [])
                  if item.get("attributes", {}).get("identifier") == ident
              ] if status == 200 else []
              print(f"BUNDLE_LOOKUP[{ident}].COUNT={len(matches)}")
              if not matches:
                  continue
              item = matches[0]
              bid = item["id"]
              resolved[ident] = bid
              a = item.get("attributes", {})
              print(f"BUNDLE[{ident}].ID={bid}")
              print(f"BUNDLE[{ident}].NAME={a.get('name')}")
              print(f"BUNDLE[{ident}].PLATFORM={a.get('platform')}")
              print(f"BUNDLE[{ident}].SEED_ID={a.get('seedId')}")

              cs, cb = get(f"/v1/bundleIds/{bid}/bundleIdCapabilities", {"limit": "200"})
              print(f"BUNDLE[{ident}].CAPABILITIES_HTTP={cs}")
              if cs == 200:
                  caps = cb.get("data", [])
                  print(f"BUNDLE[{ident}].CAPABILITY_COUNT={len(caps)}")
                  for ci, cap in enumerate(caps):
                      ca = cap.get("attributes", {})
                      print(f"BUNDLE[{ident}].CAP[{ci}].TYPE={ca.get('capabilityType')}")
                      print(f"BUNDLE[{ident}].CAP[{ci}].SETTINGS={json.dumps(ca.get('settings'), sort_keys=True)}")
              else:
                  print(json.dumps(cb, sort_keys=True))

          print("=== PROFILES ===")
          status, body = get("/v1/profiles", {"limit": "200", "include": "bundleId,certificates"})
          print(f"PROFILE_HTTP={status}")
          if status == 200:
              included = {(x.get("type"), x.get("id")): x for x in body.get("included", [])}
              rows = []
              for item in body.get("data", []):
                  rel = item.get("relationships", {})
                  bref = rel.get("bundleId", {}).get("data")
                  bundle_ident = None
                  if bref:
                      bitem = included.get((bref.get("type"), bref.get("id")), {})
                      bundle_ident = bitem.get("attributes", {}).get("identifier")
                  if bundle_ident not in bundle_ids:
                      continue
                  a = item.get("attributes", {})
                  cert_refs = rel.get("certificates", {}).get("data", [])
                  rows.append((bundle_ident, item, a, cert_refs))
              print(f"ATHLTH_PROFILE_COUNT={len(rows)}")
              for i, (ident, item, a, cert_refs) in enumerate(rows):
                  print(f"PROFILE[{i}].ID={item.get('id')}")
                  print(f"PROFILE[{i}].BUNDLE={ident}")
                  print(f"PROFILE[{i}].NAME={a.get('name')}")
                  print(f"PROFILE[{i}].STATE={a.get('profileState')}")
                  print(f"PROFILE[{i}].TYPE={a.get('profileType')}")
                  print(f"PROFILE[{i}].UUID={a.get('uuid')}")
                  print(f"PROFILE[{i}].EXPIRATION={a.get('expirationDate')}")
                  print(f"PROFILE[{i}].CERT_COUNT={len(cert_refs)}")
                  for ci, cref in enumerate(cert_refs):
                      citem = included.get((cref.get("type"), cref.get("id")), {})
                      ca = citem.get("attributes", {})
                      print(f"PROFILE[{i}].CERT[{ci}].ID={cref.get('id')}")
                      print(f"PROFILE[{i}].CERT[{ci}].NAME={ca.get('displayName')}")
                      print(f"PROFILE[{i}].CERT[{ci}].EXPIRATION={ca.get('expirationDate')}")
          else:
              print(json.dumps(body, sort_keys=True))
          PY
