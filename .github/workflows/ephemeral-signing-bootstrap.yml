name: Validate ephemeral App Store signing

on:
  push:
    branches:
      - fix/v1.4.2-swift6-release
    paths:
      - .github/workflows/ephemeral-signing-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-signing:
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare API key and JWT tooling
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import json, os
          value = os.environ["ASC_API_KEY_P8"].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
              if value[0] == '"':
                  try:
                      value = json.loads(value)
                  except json.JSONDecodeError:
                      value = value[1:-1]
              else:
                  value = value[1:-1]
          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")
          with open(os.environ["KEY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
          PY
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          python3 -m venv "$RUNNER_TEMP/asc-signing-venv"
          source "$RUNNER_TEMP/asc-signing-venv/bin/activate"
          python -m pip install --quiet pyjwt cryptography

      - name: Create temporary Apple Distribution certificate
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/asc-signing-venv/bin/activate"

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/athlth-dist.key" \
            -out "$RUNNER_TEMP/athlth-dist.csr" \
            -subj "/CN=ATHLTH CI Distribution"

          TOKEN="$(python - <<'PY'
          import os, time, jwt
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as handle:
              key = handle.read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now - 30, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          ))
          PY
          )"

          python - "$RUNNER_TEMP/athlth-dist.csr" "$RUNNER_TEMP/certificate-request.json" <<'PY'
          import json, sys
          csr_path, out_path = sys.argv[1:3]
          with open(csr_path, "r", encoding="utf-8") as handle:
              csr = handle.read()
          payload = {
              "data": {
                  "type": "certificates",
                  "attributes": {
                      "certificateType": "DISTRIBUTION",
                      "csrContent": csr,
                  },
              }
          }
          with open(out_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/certificate-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/certificate-request.json" \
            "https://api.appstoreconnect.apple.com/v1/certificates")"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Could not create Apple Distribution certificate (HTTP $HTTP_CODE)."
            cat "$RUNNER_TEMP/certificate-response.json"
            exit 1
          fi

          python - "$RUNNER_TEMP/certificate-response.json" "$RUNNER_TEMP/athlth-dist.cer" "$GITHUB_ENV" <<'PY'
          import base64, json, sys
          response_path, cert_path, env_path = sys.argv[1:4]
          with open(response_path, "r", encoding="utf-8") as handle:
              item = json.load(handle)["data"]
          content = item["attributes"]["certificateContent"]
          with open(cert_path, "wb") as handle:
              handle.write(base64.b64decode(content))
          with open(env_path, "a", encoding="utf-8") as handle:
              handle.write(f"TEMP_CERT_ID={item['id']}\n")
          print("Created temporary certificate:", item["id"])
          PY

          openssl x509 -inform DER -in "$RUNNER_TEMP/athlth-dist.cer" -out "$RUNNER_TEMP/athlth-dist.pem"
          openssl x509 -in "$RUNNER_TEMP/athlth-dist.pem" -noout -subject -issuer -dates

          P12_PASSWORD="$(openssl rand -hex 16)"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          KEYCHAIN_PATH="$RUNNER_TEMP/athlth-signing.keychain-db"

          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/athlth-dist.key" \
            -in "$RUNNER_TEMP/athlth-dist.pem" \
            -out "$RUNNER_TEMP/athlth-dist.p12" \
            -passout "pass:$P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/athlth-dist.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Create and install temporary App Store profiles
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/asc-signing-venv/bin/activate"

          TOKEN="$(python - <<'PY'
          import os, time, jwt
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as handle:
              key = handle.read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now - 30, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          ))
          PY
          )"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          create_profile() {
            local identifier="$1"
            local label="$2"
            local env_prefix="$3"
            local lookup="$RUNNER_TEMP/bundle-$env_prefix.json"

            curl --fail-with-body --silent --show-error --get \
              --output "$lookup" \
              --header "Authorization: Bearer $TOKEN" \
              --data-urlencode "filter[identifier]=$identifier" \
              --data-urlencode "limit=1" \
              "https://api.appstoreconnect.apple.com/v1/bundleIds"

            local bundle_id
            bundle_id="$(python - "$lookup" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle).get("data", [])
          print(data[0]["id"] if data else "")
          PY
            )"

            if [ -z "$bundle_id" ]; then
              echo "::error::Missing Apple bundle ID: $identifier"
              exit 1
            fi

            local profile_name="ATHLTH CI $label $GITHUB_RUN_ID"
            local request="$RUNNER_TEMP/profile-$env_prefix-request.json"
            local response="$RUNNER_TEMP/profile-$env_prefix-response.json"

            python - "$request" "$profile_name" "$bundle_id" "$TEMP_CERT_ID" <<'PY'
          import json, sys
          path, name, bundle_id, cert_id = sys.argv[1:5]
          payload = {
              "data": {
                  "type": "profiles",
                  "attributes": {
                      "name": name,
                      "profileType": "IOS_APP_STORE",
                  },
                  "relationships": {
                      "bundleId": {
                          "data": {"type": "bundleIds", "id": bundle_id}
                      },
                      "certificates": {
                          "data": [{"type": "certificates", "id": cert_id}]
                      },
                  },
              }
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

            local http_code
            http_code="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$request" \
              "https://api.appstoreconnect.apple.com/v1/profiles")"

            if [ "$http_code" != "201" ]; then
              echo "::error::Could not create App Store profile for $identifier (HTTP $http_code)."
              cat "$response"
              exit 1
            fi

            local mobileprovision="$RUNNER_TEMP/$env_prefix.mobileprovision"
            python - "$response" "$mobileprovision" "$GITHUB_ENV" "$env_prefix" <<'PY'
          import base64, json, sys
          response_path, output_path, env_path, prefix = sys.argv[1:5]
          with open(response_path, "r", encoding="utf-8") as handle:
              item = json.load(handle)["data"]
          attrs = item["attributes"]
          with open(output_path, "wb") as handle:
              handle.write(base64.b64decode(attrs["profileContent"]))
          with open(env_path, "a", encoding="utf-8") as handle:
              handle.write(f"TEMP_PROFILE_{prefix}_ID={item['id']}\n")
              handle.write(f"PROFILE_{prefix}_NAME={attrs['name']}\n")
          print(prefix, item["id"], attrs["name"])
          PY

            local plist="$RUNNER_TEMP/$env_prefix-profile.plist"
            security cms -D -i "$mobileprovision" > "$plist"
            local uuid
            uuid="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$plist")"
            cp "$mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

            echo "$identifier profile UUID: $uuid"
            /usr/libexec/PlistBuddy -c "Print :Name" "$plist"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$plist"
          }

          create_profile "com.wesc9.athlth" "Main" "MAIN"
          create_profile "com.wesc9.athlth.widgets" "Widgets" "WIDGET"
          create_profile "com.wesc9.athlth.watchkitapp" "Watch" "WATCH"

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Verify local distribution signing material
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep -q "Apple Distribution"
          test -n "${PROFILE_MAIN_NAME:-}"
          test -n "${PROFILE_WIDGET_NAME:-}"
          test -n "${PROFILE_WATCH_NAME:-}"
          echo "Ephemeral Apple Distribution certificate and App Store profiles are ready."

      - name: Clean up temporary Apple signing resources
        if: always()
        shell: bash
        run: |
          set +e
          source "$RUNNER_TEMP/asc-signing-venv/bin/activate" 2>/dev/null || true

          if [ -n "${ASC_KEY_PATH:-}" ] && [ -s "${ASC_KEY_PATH:-}" ]; then
            TOKEN="$(python - <<'PY'
          import os, time, jwt
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as handle:
              key = handle.read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now - 30, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          ))
          PY
            )"

            for id_var in TEMP_PROFILE_MAIN_ID TEMP_PROFILE_WIDGET_ID TEMP_PROFILE_WATCH_ID; do
              resource_id="${!id_var:-}"
              if [ -n "$resource_id" ]; then
                curl --silent --show-error --request DELETE \
                  --header "Authorization: Bearer $TOKEN" \
                  "https://api.appstoreconnect.apple.com/v1/profiles/$resource_id" >/dev/null
              fi
            done

            if [ -n "${TEMP_CERT_ID:-}" ]; then
              curl --silent --show-error --request DELETE \
                --header "Authorization: Bearer $TOKEN" \
                "https://api.appstoreconnect.apple.com/v1/certificates/$TEMP_CERT_ID" >/dev/null
            fi
          fi

          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
