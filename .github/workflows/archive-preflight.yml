name: Archive Preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  archive-preflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate Release archive for physical devices
        run: |
          set -euo pipefail
          xcodebuild             -project ATHLTH.xcodeproj             -scheme ATHLTH             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive"             CODE_SIGNING_ALLOWED=NO             archive

      - name: Verify archive exists
        run: |
          test -d "$RUNNER_TEMP/ATHLTH.xcarchive"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier'             "$RUNNER_TEMP/ATHLTH.xcarchive/Info.plist"
