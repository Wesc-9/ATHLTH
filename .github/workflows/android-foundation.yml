name: Android foundation (build + unit tests)

on:
  push:
    branches:
      - feature/android-foundation
    paths:
      - "android/**"
      - ".github/workflows/android-foundation.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub ubuntu runners already ship Android command-line tools.
      # Avoid setup-android@v3: its legacy 'tools' package install fails.
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command line tools missing from runner" >&2
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile and run unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :wear:assembleDebug --stacktrace
