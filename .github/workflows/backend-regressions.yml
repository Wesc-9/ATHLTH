name: ATHLTH backend regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [release/v1.6.9, release/v1.7.2, release/v1.7.3, release/v1.7.4, release/v1.7.5, release/v1.7.6, release/v1.7.7, release/v1.7.8, release/v1.7.9, release/v1.8.0, release/v1.8.1, release/v1.8.2, release/v1.8.3, release/v1.8.4, release/v1.8.5, release/v1.8.6, release/v1.8.7, release/v1.8.8, release/v1.8.9, release/v1.9.0, release/v1.9.1, release/v1.9.2, release/v1.9.3, release/v1.9.4, release/v1.9.5, release/v1.9.6, release/v1.9.7, release/v1.9.8, release/v1.9.9, release/v2.0.0, release/v2.0.1, release/v2.0.2, release/v2.0.3, release/v2.0.4, release/v2.0.5]
  push:
    branches: [release/v1.6.9, release/v1.7.2, release/v1.7.3, release/v1.7.4, release/v1.7.5, release/v1.7.6, release/v1.7.7, release/v1.7.8, release/v1.7.9, release/v1.8.0, release/v1.8.1, release/v1.8.2, release/v1.8.3, release/v1.8.4, release/v1.8.5, release/v1.8.6, release/v1.8.7, release/v1.8.8, release/v1.8.9, release/v1.9.0, release/v1.9.1, release/v1.9.2, release/v1.9.3, release/v1.9.4, release/v1.9.5, release/v1.9.6, release/v1.9.7, release/v1.9.8, release/v1.9.9, release/v2.0.0, release/v2.0.1, release/v2.0.2, release/v2.0.3, release/v2.0.4, release/v2.0.5]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guard Insights tab routing and reference design
        run: python3 scripts/audit_insights_entrypoints.py
      - name: Guard Train tab consistency and non-sticky navigation
        run: python3 scripts/audit_train_header_alignment.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Validate cross-component contracts
        run: python3 scripts/verify_v160_contracts.py
      - name: Test account media cleanup
        run: |
          node supabase/functions/_shared/account-storage-cleanup.test.ts
          node supabase/functions/_shared/ai-request-budget.test.ts
          node supabase/functions/_shared/recovery-privacy.test.ts
          node supabase/functions/_shared/strength-session-prompt.test.ts
          node supabase/functions/_shared/strength-session-handler.test.ts
      - name: Test Coach's injury exclusion guard
        run: deno test supabase/functions/_shared/ai-training-injury-guard.test.ts
      - name: Test Groq Audio Coach request policy
        run: |
          deno test supabase/functions/audio-coach-groq-turn/policy.test.ts
          deno check supabase/functions/audio-coach-groq-turn/index.ts
      - name: Test Audio Coach AI opt-in policy
        run: deno test supabase/functions/create-audio-coach-session/policy.test.ts
      - name: Typecheck changed Edge Functions
        run: deno check supabase/functions/generate-strength-session/index.ts supabase/functions/create-audio-coach-session/index.ts supabase/functions/delete-account/index.ts supabase/functions/verify-app-store-transaction/index.ts supabase/functions/app-store-notifications/index.ts supabase/functions/recovery-sense/index.ts supabase/functions/recovery-sense-v2/index.ts supabase/functions/workout-insight/index.ts supabase/functions/generate-training-program/index.ts supabase/functions/generate-plan-adaptation/index.ts supabase/functions/post-trial-offer/index.ts scripts/harden_workout_media_cache.ts
      - name: Start disposable Supabase database
        shell: bash
        env:
          # Prefer Docker Hub for transient test images to avoid GHCR's
          # shared-runner pull throttling seen on 2026-10-26.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          set -euo pipefail
          # GHCR can briefly throttle public container pulls on shared
          # runners. Retry only this disposable test-service startup;
          # all actual database/privacy assertions below remain required.
          for attempt in 1 2 3 4; do
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor; then
              echo "Supabase test database started."
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Disposable Supabase startup failed after three attempts."
              exit 1
            fi
            echo "::warning::Transient container registry/start failure; retrying database startup ($attempt/4)."
            supabase stop --no-backup || true
            sleep $((attempt * 60))
          done
      - name: Replay migrations and verify privacy rules
        run: |
          supabase db reset --local --no-seed
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/v160_audit.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/athlete_tools.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/train_together_rls.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/online_presence_mutual_follow_rls.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/training_now_mutual_presence_rls.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/security_definer_rpc_access.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/audio_coach_budget.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/post_trial_offer_15_minutes.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/arena_lifecycle_guards.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/challenge_acceptance_scoring_gate.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/social_challenge_acceptance_gate.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/direct_exercise_share_policy.sql
          docker exec -i supabase_db_ATHLTH-1.6.0 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/direct_exercise_share_request_rls.sql
          python3 scripts/test_ai_budget_concurrency.py
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup