name: Build ATHLTH

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - restore/v1-athlth-plus
      - release/v1.2
      - release/v1.3
      - release/v1.3.1
      - release/v1.3.2
      - release/v1.3.3
      - release/v1.3.4
    paths:
      - .github/build-trigger
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify committed app icons
        shell: bash
        run: |
          set -euo pipefail
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png
          test -s ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          runtimes=[r for r in data["runtimes"] if r.get("isAvailable") and ("iOS" in r.get("name","") or r.get("platform")=="iOS")]
          print(runtimes[-1]["identifier"])
          ')

          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          phones=[d for d in data["devicetypes"] if "iPhone" in d.get("name","")]
          print(phones[0]["identifier"])
          ')

          UDID=$(xcrun simctl create ATHLTHSmoke "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -path '*iphonesimulator/ATHLTH.app' -print -quit)
          test -n "$APP"
          xcrun simctl install "$UDID" "$APP"

          set +e
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.wesc9.athlth 2>&1)
          LAUNCH_STATUS=$?
          set -e
          echo "$LAUNCH_OUTPUT"

          if [ "$LAUNCH_STATUS" -ne 0 ]; then
            echo "::error::ATHLTH failed to launch."
            xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH"' || true
            exit 1
          fi

          PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
          sleep 8

          if [ -n "$PID" ] && xcrun simctl spawn "$UDID" ps -ax | grep -E "[[:space:]]$PID[[:space:]]" >/dev/null; then
            echo "ATHLTH remained alive after launch (PID $PID)."
          else
            echo "::error::ATHLTH exited shortly after launch."
            xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
            exit 1
          fi
