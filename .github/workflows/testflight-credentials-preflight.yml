name: TestFlight Credentials Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.5
      - fix/v1.4.2-swift6-release
    paths:
      - .github/credentials-trigger

permissions:
  contents: read

jobs:
  verify-app-store-connect:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - name: Validate secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "::error::ASC_API_KEY_P8 is missing"
            exit 1
          fi

      - name: Validate private key format
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import json
          import os

          value = os.environ["ASC_API_KEY_P8"].strip()

          # Accept the raw multiline PEM, or a quoted/escaped representation
          # copied from another tool. Never print the key.
          if (
              len(value) >= 2
              and value[0] == value[-1]
              and value[0] in {"'", '"'}
          ):
              if value[0] == '"':
                  try:
                      value = json.loads(value)
                  except json.JSONDecodeError:
                      value = value[1:-1]
              else:
                  value = value[1:-1]

          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")

          with open(os.environ["KEY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
          PY

          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install JWT dependencies
        run: python3 -m pip install --quiet PyJWT cryptography

      - name: Authenticate with App Store Connect API
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(
            ASC_KEY_PATH="$ASC_KEY_PATH" python3 - <<'PY'
          import os
          import time
          import jwt

          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as handle:
              private_key = handle.read()

          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": now,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={
                  "kid": os.environ["ASC_KEY_ID"],
                  "typ": "JWT",
              },
          )
          print(token)
          PY
          )"

          HTTP_CODE="$(
            curl               --silent               --show-error               --output "$RUNNER_TEMP/appstore-connect-response.json"               --write-out '%{http_code}'               --header "Authorization: Bearer $TOKEN"               'https://api.appstoreconnect.apple.com/v1/apps?limit=1'
          )"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::App Store Connect authentication failed with HTTP $HTTP_CODE"
            python3 - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "appstore-connect-response.json")
          try:
              with open(path, "r", encoding="utf-8") as handle:
                  body = json.load(handle)
              for item in body.get("errors", []):
                  print(
                      "Apple error:",
                      item.get("status", ""),
                      item.get("code", ""),
                      item.get("title", ""),
                      item.get("detail", ""),
                  )
          except Exception:
              print("Apple returned a non-JSON error response.")
          PY
            exit 1
          fi

          echo "App Store Connect API credentials are valid."

          for endpoint in profiles certificates bundleIds; do
            HTTP_CODE="$(curl               --silent               --show-error               --output "$RUNNER_TEMP/appstore-connect-${endpoint}.json"               --write-out '%{http_code}'               --header "Authorization: Bearer $TOKEN"               "https://api.appstoreconnect.apple.com/v1/${endpoint}?limit=1")"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::App Store Connect credentials authenticate, but cannot access /v1/${endpoint} (HTTP $HTTP_CODE). Automatic TestFlight signing requires a Team API key with Certificates, Identifiers & Profiles access."
              python3 - "$RUNNER_TEMP/appstore-connect-${endpoint}.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, "r", encoding="utf-8") as handle:
                  body = json.load(handle)
              for item in body.get("errors", []):
                  print(
                      "Apple provisioning error:",
                      item.get("status", ""),
                      item.get("code", ""),
                      item.get("title", ""),
                      item.get("detail", ""),
                  )
          except Exception:
              print("Apple returned a non-JSON provisioning error response.")
          PY
              exit 1
            fi
          done

          echo "App Store Connect provisioning access is valid for profiles, certificates and bundle IDs."

          for bundle_id in com.wesc9.athlth com.wesc9.athlth.widgets com.wesc9.athlth.watchkitapp; do
            HTTP_CODE="$(curl               --silent               --show-error               --get               --output "$RUNNER_TEMP/bundle-id.json"               --write-out '%{http_code}'               --header "Authorization: Bearer $TOKEN"               --data-urlencode "filter[identifier]=${bundle_id}"               --data-urlencode "limit=1"               'https://api.appstoreconnect.apple.com/v1/bundleIds')"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Could not verify bundle ID ${bundle_id} (HTTP $HTTP_CODE)."
              exit 1
            fi

            BUNDLE_COUNT="$(python3 - "$RUNNER_TEMP/bundle-id.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              print(len(json.load(handle).get("data", [])))
          PY
            )"

            if [ "$BUNDLE_COUNT" != "1" ]; then
              echo "::error::Required Apple Developer bundle ID is not registered: ${bundle_id}"
              exit 1
            fi

            echo "Verified Apple Developer bundle ID: ${bundle_id}"
          done
