name: ATHLTH iPad Compatibility Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
      - release/v1.4.4
      - release/v1.4.6
      - release/v1.5.1
      - release/v1.5.2
      - release/v1.5.3
      - release/v1.6.9
      - release/v1.7.2
      - release/v1.7.3
      - release/v1.7.4
      - release/v1.7.5
      - release/v1.7.6
      - release/v1.7.8
      - release/v1.7.9
      - release/v1.8.0
      - release/v1.8.1
      - release/v1.8.2
      - release/v1.8.3
      - release/v2.0.0
      - release/v2.0.1
      - release/v2.0.3
      - release/v2.0.4
      - release/v2.0.5
      - release/v2.0.6
      - release/v2.0.7
      - release/v2.0.8
      - release/v2.0.9
      - release/v2.1.0
      - release/v2.1.2
      - release/v2.1.3
      - release/v2.1.4
      - release/v2.1.5
      - release/v2.1.8
      - release/v2.1.9
      - release/v2.2.0
      - release/v2.2.1
      - release/v2.2.2
      - release/v2.2.3
      - release/v2.2.4
      - release/v2.2.5
      - release/v2.2.6
      - release/v2.2.7
      - release/v2.2.8
      - release/v2.2.9
      - release/v2.3.0
      - release/v3.0.0
      - release/v3.0.1
      # Run an independent iPad smoke check on v2.2.5 as well as the
      # 11/13-inch checks that follow the complete XCTest build. This
      # detects iPad compile/launch regressions without waiting for the
      # full several-thousand-case iPhone test suite.
    paths:
      - ATHLTH/Planning/ATHLTHIntervalGroupAdjustmentView.swift
      - ATHLTH/Planning/ATHLTHPlannedWorkoutStudioView.swift
      - ATHLTH/Planning/ATHLTHIntervalRecipeEditing.swift
      - Tests/ATHLTHIntervalRecipeEditingTests.swift
      - ATHLTH/**/*.swift
      - ATHLTH/Assets.xcassets/**
      - Shared/**/*.swift
      - ATHLTHWidgets/**/*.swift
      - ATHLTHWidgets/Localizable.xcstrings
      - project.yml
      - scripts/optimize_hero_assets.sh
      - .github/workflows/ipad-smoke.yml
      - .github/ipad-trigger
      - .github/launch-trigger
      - .github/testflight-trigger

concurrency:
  group: athlth-ipad-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-smoke-app:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    outputs:
      run-id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Locate exact-commit universal simulator artifact
        id: resolve
        if: github.ref == 'refs/heads/release/v3.0.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Wait on a cheap Linux runner, not an occupied macOS runner.
          # Standalone iPad pushes may not trigger the iPhone workflow.
          for attempt in $(seq 1 80); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/launch-smoke.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == env.GITHUB_REF_NAME and .head_sha == env.GITHUB_SHA and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.id) | last // empty')
            if [ -z "$run" ]; then
              if [ "$attempt" -ge 3 ]; then break; fi
            else
              id=$(jq -r '.id' <<< "$run")
              artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "athlth-iphone-simulator-app" and .expired == false and .size_in_bytes > 0)] | length')
              if [ "$artifact" = 1 ]; then
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$(jq -r '.status' <<< "$run")" = completed ]; then break; fi
            fi
            sleep 60
          done
          echo "::notice::No shareable app available; run independent iPad build."

  ipad-smoke:
    needs: resolve-smoke-app
    runs-on: xcode-27
    # Independent iPad build/launch check; no TestFlight upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify iPad simulator-selection regressions
        run: python3 -m unittest discover -s scripts -p 'test_select_ipad_simulators.py' -v

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install validation tools
        run: |
          brew install xcodegen
          brew install imagemagick

      - name: Download exact-commit shared simulator app
        if: needs.resolve-smoke-app.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: athlth-iphone-simulator-app
          path: ${{ runner.temp }}/athlth-smoke-package
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-smoke-app.outputs.run-id }}

      - name: Verify universal simulator app
        if: needs.resolve-smoke-app.outputs.run-id != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/athlth-smoke-package"
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          shasum -a 256 -c SHA256SUMS
          grep -qw "$(uname -m)" architectures.txt
          mkdir -p "$RUNNER_TEMP/athlth-shared-app"
          ditto -x -k ATHLTH.zip "$RUNNER_TEMP/athlth-shared-app"
          APP="$RUNNER_TEMP/athlth-shared-app/ATHLTH.app"
          test -x "$APP/ATHLTH"
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); assert {1,2}.issubset(p["UIDeviceFamily"]), "Expected universal iPhone/iPad app"' "$APP/Info.plist"
          echo "ATHLTH_IPAD_SMOKE_APP=$APP" >> "$GITHUB_ENV"

      - name: Optimize hero assets for runtime memory
        if: needs.resolve-smoke-app.outputs.run-id == ''
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Embed RepDB offline exercise assets
        if: needs.resolve-smoke-app.outputs.run-id == ''
        run: python3 scripts/prepare_repdb_offline.py

      - name: Cache public SwiftPM repository objects
        if: needs.resolve-smoke-app.outputs.run-id == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ATHLTHSourcePackages/repositories
          key: swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            swiftpm-repos-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate iPad smoke-test project
        if: needs.resolve-smoke-app.outputs.run-id == ''
        shell: bash
        run: |
          set -euo pipefail
          cp project.yml project-ipad-smoke.yml
          python3 - project-ipad-smoke.yml <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("      - target: ATHLTHWatchApp\n        embed: true\n", "")
          path.write_text(text)
          PY
          xcodegen generate --spec project-ipad-smoke.yml

      - name: Build simulator app
        if: needs.resolve-smoke-app.outputs.run-id == ''
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ATHLTHSourcePackages" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 3 \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch onboarding and all main tabs on iPad
        # The 11- and 13-inch layouts are already independently exercised
        # after full XCTest by Build ATHLTH. This independent smoke job
        # checks all 12 screens on 11-inch without reusing a tired runner
        # for a second 13-inch simulator (which timed out in two CI runs).
        shell: bash
        env:
          ATHLTH_IPAD_SMOKE_SIZE: "11"
        run: bash scripts/run_ipad_smoke.sh

      - name: Upload iPad smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-ipad-smoke-screenshots
          path: ${{ runner.temp }}/athlth-ipad-*.png
          if-no-files-found: warn
          retention-days: 7