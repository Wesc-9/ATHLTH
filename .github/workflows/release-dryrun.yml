# Final pre-upload validation: unsigned archive + cloud-signed local export
name: Validate TestFlight pipeline without upload

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.5
      - fix/v1.4.2-swift6-release
    paths:
      - .github/release-trigger

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: D3AX7B6RMW
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify committed app icons
        shell: bash
        run: |
          set -euo pipefail
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png
          test -s ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import json
          import os

          value = os.environ["ASC_API_KEY_P8"].strip()

          if (
              len(value) >= 2
              and value[0] == value[-1]
              and value[0] in {"'", '"'}
          ):
              if value[0] == '"':
                  try:
                      value = json.loads(value)
                  except json.JSONDecodeError:
                      value = value[1:-1]
              else:
                  value = value[1:-1]

          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")

          with open(os.environ["KEY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
          PY

          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare ephemeral App Store signing
        shell: bash
        run: bash scripts/prepare_ephemeral_app_store_signing.sh

      - name: Archive without creating development certificates
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Verify archived app structure and versions
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app"
          WATCH_APP="$IOS_APP/Watch/ATHLTH.app"
          WIDGET_APP="$IOS_APP/PlugIns/ATHLTHWidgets.appex"
          test -d "$IOS_APP"
          test -d "$WATCH_APP"
          test -d "$WIDGET_APP"
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IOS_APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET_APP/Info.plist")
          IOS_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$IOS_APP/Info.plist")
          WATCH_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP/Info.plist")
          WIDGET_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WIDGET_APP/Info.plist")
          echo "iPhone: $IOS_VERSION ($IOS_BUILD)"
          echo "Watch:  $WATCH_VERSION ($WATCH_BUILD)"
          echo "Widget: $WIDGET_VERSION ($WIDGET_BUILD)"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_BUILD" = "$WIDGET_BUILD"
          test "$IOS_VERSION" = "$WATCH_VERSION"
          test "$IOS_VERSION" = "$WIDGET_VERSION"
          test "$IOS_BUILD" -gt 1

      - name: Seed archive entitlements with ad-hoc signatures
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app"
          WATCH_APP="$IOS_APP/Watch/ATHLTH.app"
          WIDGET_APP="$IOS_APP/PlugIns/ATHLTHWidgets.appex"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements" "$WATCH_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTHWidgets/ATHLTHWidgets.entitlements" "$WIDGET_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTH/Resources/ATHLTH.entitlements" "$IOS_APP"
          echo "Archive Watch entitlements after ad-hoc signing:"
          codesign -d --entitlements :- "$WATCH_APP" 2>/dev/null

      - name: Create local export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.wesc9.athlth</key>
              <string>$PROFILE_MAIN_NAME</string>
              <key>com.wesc9.athlth.widgets</key>
              <string>$PROFILE_WIDGET_NAME</string>
              <key>com.wesc9.athlth.watchkitapp</key>
              <string>$PROFILE_WATCH_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA without uploading
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify exported IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' -print -quit)
          WIDGET_APP=$(find "$APP/PlugIns" -maxdepth 1 -name 'ATHLTHWidgets.appex' -print -quit)
          test -n "$WATCH_APP"
          test -n "$WIDGET_APP"
          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$WATCH_APP"
          codesign --verify --strict "$WIDGET_APP"

          IOS_ENT="$RUNNER_TEMP/ios-entitlements.plist"
          WATCH_ENT="$RUNNER_TEMP/watch-entitlements.plist"
          WIDGET_ENT="$RUNNER_TEMP/widget-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$IOS_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WATCH_APP" > "$WATCH_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WIDGET_APP" > "$WIDGET_ENT" 2>/dev/null

          echo "iPhone signed entitlements:"
          plutil -p "$IOS_ENT"
          echo "Watch signed entitlements:"
          plutil -p "$WATCH_ENT"
          echo "Widget signed entitlements:"
          plutil -p "$WIDGET_ENT"

          IOS_PROFILE="$RUNNER_TEMP/ios-profile.plist"
          WATCH_PROFILE="$RUNNER_TEMP/watch-profile.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$IOS_PROFILE"
          security cms -D -i "$WATCH_APP/embedded.mobileprovision" > "$WATCH_PROFILE"
          echo "iPhone provisioning profile entitlements:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$IOS_PROFILE"
          echo "Watch provisioning profile entitlements:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$WATCH_PROFILE"

          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit.background-delivery" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$IOS_ENT" | grep -qx "Default"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$WATCH_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$IOS_ENT" | grep -qx "group.com.wesc9.athlth"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$WIDGET_ENT" | grep -qx "group.com.wesc9.athlth"

          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist" | grep -qx "com.wesc9.athlth"
          /usr/libexec/PlistBuddy -c "Print :WKBackgroundModes:0" "$WATCH_APP/Info.plist" | grep -qx "workout-processing"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -qx "athlth"

          ICON=$(find "$APP" -maxdepth 1 -name 'AppIcon*.png' -print -quit)
          test -n "$ICON"
          test -s "$ICON"
          echo "Release capabilities, Watch companion metadata and compiled app icon verified."

          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET_APP/Info.plist")
          echo "Exported iPhone CFBundleVersion: $IOS_BUILD"
          echo "Exported Watch CFBundleVersion: $WATCH_BUILD"
          echo "Exported Widget CFBundleVersion: $WIDGET_BUILD"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_BUILD" = "$WIDGET_BUILD"

      - name: Clean up ephemeral App Store signing
        if: always()
        shell: bash
        run: bash scripts/cleanup_ephemeral_app_store_signing.sh

      - name: Upload dry-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-release-dryrun-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/export
            /var/folders/**/T/*.xcdistributionlogs
          if-no-files-found: ignore
