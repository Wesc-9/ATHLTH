name: Upload ATHLTH to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
    paths:
      - .github/testflight-trigger

concurrency:
  group: athlth-testflight
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  testflight:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: D3AX7B6RMW
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate app icons from approved source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icons.py

      - name: Verify approved app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import struct
          import zlib
          from pathlib import Path

          icons = [
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png"),
              Path("ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png"),
              Path("ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
          ]

          def validate_png(path: Path) -> bytes:
              payload = path.read_bytes()
              if payload[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path}: invalid PNG signature")

              offset = 8
              width = height = None
              idat = bytearray()
              saw_iend = False

              while offset + 12 <= len(payload):
                  length = struct.unpack(">I", payload[offset:offset + 4])[0]
                  kind = payload[offset + 4:offset + 8]
                  data_start = offset + 8
                  data_end = data_start + length
                  crc_end = data_end + 4
                  if crc_end > len(payload):
                      raise SystemExit(f"{path}: truncated PNG chunk {kind!r}")

                  data = payload[data_start:data_end]
                  stored_crc = struct.unpack(">I", payload[data_end:crc_end])[0]
                  actual_crc = zlib.crc32(kind + data) & 0xFFFFFFFF
                  if stored_crc != actual_crc:
                      raise SystemExit(f"{path}: CRC mismatch in {kind!r}")

                  if kind == b"IHDR":
                      width, height, bit_depth, color_type, _, _, _ = struct.unpack(
                          ">IIBBBBB", data
                      )
                      if (width, height) != (1024, 1024):
                          raise SystemExit(
                              f"{path}: expected 1024x1024, got {width}x{height}"
                          )
                      if bit_depth != 8 or color_type != 2:
                          raise SystemExit(
                              f"{path}: expected 8-bit RGB PNG, got bit_depth={bit_depth}, color_type={color_type}"
                          )
                  elif kind == b"IDAT":
                      idat.extend(data)
                  elif kind == b"IEND":
                      saw_iend = True
                      offset = crc_end
                      break

                  offset = crc_end

              if not saw_iend:
                  raise SystemExit(f"{path}: missing IEND")
              if width is None or height is None or not idat:
                  raise SystemExit(f"{path}: incomplete PNG structure")

              raw = zlib.decompress(bytes(idat))
              expected = 1024 * (1 + 1024 * 3)
              if len(raw) != expected:
                  raise SystemExit(
                      f"{path}: decoded image length {len(raw)} != {expected}"
                  )

              return payload

          payloads = [validate_png(path) for path in icons]
          if any(payload != payloads[0] for payload in payloads[1:]):
              raise SystemExit("ATHLTH normal, dark, tinted and Watch icons must match")

          print("Approved 1024x1024 ATHLTH icon is structurally valid for iPhone and Watch.")
          PY

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import json
          import os

          value = os.environ["ASC_API_KEY_P8"].strip()

          if (
              len(value) >= 2
              and value[0] == value[-1]
              and value[0] in {"'", '"'}
          ):
              if value[0] == '"':
                  try:
                      value = json.loads(value)
                  except json.JSONDecodeError:
                      value = value[1:-1]
              else:
                  value = value[1:-1]

          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")

          with open(os.environ["KEY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
          PY

          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive without creating development certificates
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Verify archived bundle versions
        shell: bash
        run: |
          set -euo pipefail
          IOS_PLIST="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app/Info.plist"
          WATCH_PLIST="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app/Watch/ATHLTH.app/Info.plist"
          WIDGET_PLIST="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app/PlugIns/ATHLTHWidgets.appex/Info.plist"
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IOS_PLIST")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_PLIST")
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET_PLIST")
          INTERFACE_STYLE=$(/usr/libexec/PlistBuddy -c "Print :UIUserInterfaceStyle" "$IOS_PLIST")
          echo "iPhone CFBundleVersion: $IOS_BUILD"
          echo "Watch CFBundleVersion: $WATCH_BUILD"
          echo "Widget CFBundleVersion: $WIDGET_BUILD"
          echo "iPhone UIUserInterfaceStyle: $INTERFACE_STYLE"
          if [ "$INTERFACE_STYLE" != "Light" ]; then
            echo "::error::ATHLTH 1.4.3 must archive with UIUserInterfaceStyle=Light."
            exit 1
          fi
          if [ "$IOS_BUILD" -le 1 ] || [ "$WATCH_BUILD" -le 1 ] || [ "$WIDGET_BUILD" -le 1 ]; then
            echo "::error::iPhone, Watch and Widget bundle versions must be greater than 1."
            exit 1
          fi
          if [ "$IOS_BUILD" != "$WATCH_BUILD" ] || [ "$IOS_BUILD" != "$WIDGET_BUILD" ]; then
            echo "::error::iPhone, Watch and Widget bundle versions must match."
            exit 1
          fi

      - name: Seed archive entitlements with ad-hoc signatures
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/ATHLTH.xcarchive/Products/Applications/ATHLTH.app"
          WATCH_APP="$IOS_APP/Watch/ATHLTH.app"
          WIDGET_APP="$IOS_APP/PlugIns/ATHLTHWidgets.appex"
          test -d "$WIDGET_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements" "$WATCH_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTHWidgets/ATHLTHWidgets.entitlements" "$WIDGET_APP"
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/ATHLTH/Resources/ATHLTH.entitlements" "$IOS_APP"

      - name: Create validation export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ValidationExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export and validate signed IPA before upload
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/validation-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ValidationExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA=$(find "$RUNNER_TEMP/validation-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/validation-ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/validation-ipa"
          APP=$(find "$RUNNER_TEMP/validation-ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' -print -quit)
          WIDGET_APP=$(find "$APP/PlugIns" -maxdepth 1 -name 'ATHLTHWidgets.appex' -print -quit)
          test -n "$APP"
          test -n "$WATCH_APP"
          test -n "$WIDGET_APP"

          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$WATCH_APP"
          codesign --verify --strict "$WIDGET_APP"

          IOS_ENT="$RUNNER_TEMP/validation-ios-entitlements.plist"
          WATCH_ENT="$RUNNER_TEMP/validation-watch-entitlements.plist"
          WIDGET_ENT="$RUNNER_TEMP/validation-widget-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$IOS_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WATCH_APP" > "$WATCH_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WIDGET_APP" > "$WIDGET_ENT" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$WATCH_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$IOS_ENT" | grep -qx "group.com.wesc9.athlth"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$WIDGET_ENT" | grep -qx "group.com.wesc9.athlth"

          IOS_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          WATCH_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist")
          IOS_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          WATCH_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP/Info.plist")
          echo "Validated iPhone: $IOS_VERSION ($IOS_BUILD)"
          echo "Validated Watch:  $WATCH_VERSION ($WATCH_BUILD)"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_VERSION" = "$WATCH_VERSION"
          test "$IOS_BUILD" -gt 1

      - name: Verify release capabilities and companion metadata
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/validation-export" -maxdepth 1 -name '*.ipa' -print -quit)
          rm -rf "$RUNNER_TEMP/capability-check"
          mkdir -p "$RUNNER_TEMP/capability-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/capability-check"
          APP=$(find "$RUNNER_TEMP/capability-check/Payload" -maxdepth 1 -name '*.app' -print -quit)
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' -print -quit)
          WIDGET_APP=$(find "$APP/PlugIns" -maxdepth 1 -name 'ATHLTHWidgets.appex' -print -quit)

          IOS_ENT="$RUNNER_TEMP/capability-ios-entitlements.plist"
          WATCH_ENT="$RUNNER_TEMP/capability-watch-entitlements.plist"
          WIDGET_ENT="$RUNNER_TEMP/capability-widget-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$IOS_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WATCH_APP" > "$WATCH_ENT" 2>/dev/null
          codesign -d --entitlements :- "$WIDGET_APP" > "$WIDGET_ENT" 2>/dev/null

          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit.background-delivery" "$IOS_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$IOS_ENT" | grep -qx "Default"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$WATCH_ENT" | grep -qx "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$IOS_ENT" | grep -qx "group.com.wesc9.athlth"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$WIDGET_ENT" | grep -qx "group.com.wesc9.athlth"

          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist" | grep -qx "com.wesc9.athlth"
          /usr/libexec/PlistBuddy -c "Print :WKBackgroundModes:0" "$WATCH_APP/Info.plist" | grep -qx "workout-processing"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -qx "athlth"

          ICON=$(find "$APP" -maxdepth 1 -name 'AppIcon*.png' -print -quit)
          test -n "$ICON"
          test -s "$ICON"
          echo "Release capabilities, Watch companion metadata and compiled app icon verified."

      - name: Create upload export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Upload to App Store Connect / TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ATHLTH.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v1.4.3" >/dev/null 2>&1; then
            echo "GitHub release v1.4.0 already exists; TestFlight build uploaded without recreating the release."
          else
            gh release create "v1.4.3" \
              --target "$GITHUB_SHA" \
              --title "ATHLTH 1.4.3" \
              --notes-file - <<'EOF'
          ATHLTH 1.4.3

          - Community groups, activity center, route/challenge improvements
          - Recovery redesign with Last Night, Daily Check-in and actionable guidance
          - Multi-plan scheduling, Gear improvements and profile/settings polish
          - Main tab hero, scrolling and Progress visual refinements
          EOF
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-testflight-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/export
          if-no-files-found: ignore
