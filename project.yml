name: ATHLTH
options:
  bundleIdPrefix: com.wesc9
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ATHLTH:
    type: application
    platform: iOS
    sources:
      - path: ATHLTH
      - path: Shared
    dependencies:
      - target: ATHLTHWatchApp
      - package: Supabase
    info:
      path: ATHLTH/Resources/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        NSHealthShareUsageDescription: "ATHLTH reads workouts, sleep, and heart data to give you private training insights on your device."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wesc9.athlth.auth
            CFBundleURLSchemes:
              - athlth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth
        PRODUCT_NAME: ATHLTH
        CODE_SIGN_ENTITLEMENTS: ATHLTH/Resources/ATHLTH.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

  ATHLTHWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ATHLTHWatchApp
    dependencies:
      - target: ATHLTHWatchExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.watchkitapp
        PRODUCT_NAME: ATHLTH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATHLTH
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.wesc9.athlth
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ATHLTHWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ATHLTHWatchExtension
      - path: Shared
    info:
      path: ATHLTHWatchExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.watchkitapp.watchkitextension
        PRODUCT_NAME: ATHLTH Watch
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements
        CODE_SIGN_STYLE: Automatic
