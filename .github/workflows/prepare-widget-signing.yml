name: Prepare ATHLTH Widget Signing

on:
  push:
    branches:
      - fix/v1.4.2-swift6-release
    paths:
      - .github/apple-signing-registration-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-widget-signing:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

    steps:
      - name: Validate App Store Connect credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Prepare API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import json
          import os

          value = os.environ["ASC_API_KEY_P8"].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
              if value[0] == '"':
                  try:
                      value = json.loads(value)
                  except json.JSONDecodeError:
                      value = value[1:-1]
              else:
                  value = value[1:-1]
          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")
          with open(os.environ["KEY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
          PY
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install JWT dependencies
        run: python3 -m pip install --quiet PyJWT cryptography

      - name: Register widget bundle ID and enable App Groups capability
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(
            ASC_KEY_PATH="$ASC_KEY_PATH" python3 - <<'PY'
          import os
          import time
          import jwt

          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as handle:
              private_key = handle.read()

          now = int(time.time())
          print(jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": now,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          ))
          PY
          )"

          api_get_bundle() {
            local identifier="$1"
            local output="$2"
            curl --fail-with-body --silent --show-error --get               --output "$output"               --header "Authorization: Bearer $TOKEN"               --data-urlencode "filter[identifier]=$identifier"               --data-urlencode "limit=1"               "https://api.appstoreconnect.apple.com/v1/bundleIds"
          }

          bundle_resource_id() {
            python3 - "$1" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle).get("data", [])
          print(data[0]["id"] if data else "")
          PY
          }

          ensure_bundle() {
            local identifier="$1"
            local name="$2"
            local lookup="$RUNNER_TEMP/bundle-lookup.json"
            api_get_bundle "$identifier" "$lookup"
            local resource_id
            resource_id="$(bundle_resource_id "$lookup")"

            if [ -z "$resource_id" ]; then
              python3 - "$RUNNER_TEMP/create-bundle.json" "$identifier" "$name" <<'PY'
          import json
          import sys
          path, identifier, name = sys.argv[1:4]
          payload = {
              "data": {
                  "type": "bundleIds",
                  "attributes": {
                      "identifier": identifier,
                      "name": name,
                      "platform": "IOS",
                  },
              }
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

              HTTP_CODE="$(curl --silent --show-error                 --output "$RUNNER_TEMP/create-bundle-response.json"                 --write-out '%{http_code}'                 --request POST                 --header "Authorization: Bearer $TOKEN"                 --header "Content-Type: application/json"                 --data-binary "@$RUNNER_TEMP/create-bundle.json"                 "https://api.appstoreconnect.apple.com/v1/bundleIds")"

              if [ "$HTTP_CODE" != "201" ]; then
                echo "::error::Apple could not register $identifier (HTTP $HTTP_CODE)."
                cat "$RUNNER_TEMP/create-bundle-response.json"
                exit 1
              fi

              resource_id="$(python3 - "$RUNNER_TEMP/create-bundle-response.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              print(json.load(handle)["data"]["id"])
          PY
              )"
              echo "Registered Apple Developer bundle ID: $identifier" >&2
            else
              echo "Apple Developer bundle ID already exists: $identifier" >&2
            fi

            printf '%s' "$resource_id"
          }

          ensure_app_groups_capability() {
            local resource_id="$1"
            local identifier="$2"
            local capabilities="$RUNNER_TEMP/capabilities.json"

            curl --fail-with-body --silent --show-error               --output "$capabilities"               --header "Authorization: Bearer $TOKEN"               "https://api.appstoreconnect.apple.com/v1/bundleIds/$resource_id/bundleIdCapabilities"

            local enabled
            enabled="$(python3 - "$capabilities" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle).get("data", [])
          print("yes" if any(
              item.get("attributes", {}).get("capabilityType") == "APP_GROUPS"
              for item in data
          ) else "no")
          PY
            )"

            if [ "$enabled" = "yes" ]; then
              echo "App Groups capability already enabled: $identifier"
              return
            fi

            python3 - "$RUNNER_TEMP/enable-app-groups.json" "$resource_id" <<'PY'
          import json
          import sys
          path, resource_id = sys.argv[1:3]
          payload = {
              "data": {
                  "type": "bundleIdCapabilities",
                  "attributes": {
                      "capabilityType": "APP_GROUPS"
                  },
                  "relationships": {
                      "bundleId": {
                          "data": {
                              "type": "bundleIds",
                              "id": resource_id
                          }
                      }
                  }
              }
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

            HTTP_CODE="$(curl --silent --show-error               --output "$RUNNER_TEMP/enable-app-groups-response.json"               --write-out '%{http_code}'               --request POST               --header "Authorization: Bearer $TOKEN"               --header "Content-Type: application/json"               --data-binary "@$RUNNER_TEMP/enable-app-groups.json"               "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities")"

            if [ "$HTTP_CODE" != "201" ]; then
              echo "::error::Apple could not enable App Groups for $identifier (HTTP $HTTP_CODE)."
              cat "$RUNNER_TEMP/enable-app-groups-response.json"
              exit 1
            fi

            echo "Enabled App Groups capability: $identifier"
          }

          MAIN_RESOURCE_ID="$(ensure_bundle "com.wesc9.athlth" "ATHLTH")"
          WIDGET_RESOURCE_ID="$(ensure_bundle "com.wesc9.athlth.widgets" "ATHLTH Widgets")"

          ensure_app_groups_capability "$MAIN_RESOURCE_ID" "com.wesc9.athlth"
          ensure_app_groups_capability "$WIDGET_RESOURCE_ID" "com.wesc9.athlth.widgets"

          echo "ATHLTH bundle IDs are ready for App Group provisioning."
