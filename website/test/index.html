<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d13">
<meta name="description" content="ATHLTH — Coming soon.">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ATHLTH — Coming soon</title>
<style>
:root{
 color-scheme:dark;--mx:0;--my:0;--shine-x:50%;--shine-y:36%;
 --logo-mask:none;--scroll-progress:0;--plate:rgba(230,249,255,.07);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-width:280px;background:#090d13;color:#f2f8fa}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased;overflow-x:hidden}
.scene{position:relative;height:200svh;min-height:860px;isolation:isolate}
.stage{height:100svh;min-height:430px;position:sticky;top:0;display:grid;place-items:center;
 isolation:isolate;overflow:hidden;background:
 radial-gradient(ellipse 45% 47% at 50% 44%,#2a343f 0%,#161e28 31%,#0c121b 65%,#070b11 100%)}
.stage::before{content:"";pointer-events:none;position:absolute;inset:-60%;z-index:-4;
 background:conic-gradient(from -18deg at 50% 50%,transparent 0 50deg,#57939d14 84deg,transparent 112deg,
 #daeaf00a 167deg,transparent 206deg,#85b7c713 264deg,transparent 312deg,#899aa70e 336deg,transparent 360deg);
 filter:blur(68px);animation:ambient-turn 48s linear infinite}
.stage::after{content:"";position:absolute;inset:0;z-index:12;pointer-events:none;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.31'/%3E%3C/svg%3E");
 opacity:.12;mix-blend-mode:soft-light}
.sweep-a,.sweep-b{position:absolute;inset:-60%;z-index:-3;pointer-events:none;opacity:.55;filter:blur(3px)}
.sweep-a{background:linear-gradient(109deg,transparent 37%,#95d6e00a 43%,#d4f1fb12 47%,transparent 50% 100%);
 transform:rotate(-8deg);animation:light-sweep 17s ease-in-out infinite}
.sweep-b{background:linear-gradient(70deg,transparent 42%,#e5faff06 47%,#8ca9ba12 50%,transparent 54% 100%);
 transform:rotate(17deg);animation:light-sweep 23s ease-in-out -9s infinite reverse}
.halo{position:absolute;left:50%;top:43%;width:min(1020px,108vw);aspect-ratio:1;
 transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:-1;
 background:radial-gradient(circle,#95bccb13 0 18%,#688e9d0b 26%,#06101b05 48%,transparent 71%);
 filter:blur(15px);animation:halo-breathe 8s ease-in-out infinite}
.halo::after{content:"";position:absolute;inset:10%;
 border-radius:50%;border:1px solid #c4e4e80b;box-shadow:0 0 75px #8db5c50b,inset 0 0 95px #7eafbd09}
.orbit{position:absolute;left:50%;top:45%;aspect-ratio:1;border-radius:50%;
 pointer-events:none;transform-style:preserve-3d;opacity:.49}
.orbit-a{width:min(850px,104vw);border:1px solid #d8f0fc12;
 transform:translate(-50%,-50%) rotateX(69deg) rotateZ(24deg);
 box-shadow:0 0 32px #99bbd707,0 0 0 28px #d7faff02;
 animation:orbit-a 27s ease-in-out infinite alternate}
.orbit-b{width:min(1100px,130vw);border:1px solid transparent;border-top-color:#bed5e514;
 border-bottom-color:#7fa4b90a;transform:translate(-50%,-50%) rotateX(73deg) rotateZ(-18deg);
 animation:orbit-b 34s ease-in-out infinite alternate-reverse}
.reflection-floor{position:absolute;top:67%;left:50%;width:min(780px,105vw);height:190px;
 transform:translateX(-50%);z-index:0;pointer-events:none;
 background:radial-gradient(ellipse at 50% 18%,#96afc223,#89acbc10 42%,transparent 72%);
 filter:blur(32px);opacity:.6;animation:floor-pulse 8s ease-in-out infinite}
.plate{position:absolute;left:50%;top:44%;width:min(78vw,920px);height:200px;
 transform:translate(-50%,-50%) rotate(-25deg);pointer-events:none;
 background:linear-gradient(90deg,transparent,#cbebfb05,transparent);filter:blur(75px)}
.content{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
 width:100%;padding:28px 20px 12px;transform:translateY(-1.5vh)}
.logo-space{width:min(73vw,665px);height:clamp(260px,47vw,495px);
 position:relative;display:grid;place-items:center;perspective:1400px;perspective-origin:50% 44%;touch-action:pan-y}
.logo-space::after{content:"";position:absolute;z-index:-1;width:65%;height:24%;left:50%;bottom:-5%;
 transform:translateX(-50%);background:radial-gradient(ellipse,#05090e9c 13%,#0b17244d 40%,transparent 74%);
 filter:blur(23px)}
.mount{position:relative;width:100%;height:100%;display:grid;place-items:center;
 transform-style:preserve-3d;will-change:transform;transform:rotateX(0deg) rotateY(-11deg);
 opacity:0;animation:materialize 2.5s cubic-bezier(.16,1,.23,1) .13s forwards}
.logo-3d{position:relative;width:100%;max-width:640px;aspect-ratio:1.28;
 transform-style:preserve-3d;transform:translateZ(0)}
.layer,.surface,.iridescence,.specular,.rim{position:absolute;inset:0;
 -webkit-mask-image:var(--logo-mask);mask-image:var(--logo-mask);
 -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
 -webkit-mask-size:100% 100%;mask-size:100% 100%;
 -webkit-mask-position:center;mask-position:center;pointer-events:none;
 backface-visibility:visible}
.layer{background:linear-gradient(132deg,#111922 1%,#243944 22%,#718998 46%,#101a23 72%,#060b11 100%);
 filter:brightness(var(--brightness,1));transform:translateZ(var(--z,0px))}
.surface{transform:translateZ(2.4px);background:
 radial-gradient(ellipse 27% 48% at var(--shine-x) var(--shine-y),#c8ebf5b9 0%,transparent 72%),
 linear-gradient(134deg,
 #14242e 0%,#293c49 8%,#b8cfda 17%,#263b4a 24%,#0a1925 34%,#819eac 48%,#d0e5eb 52%,
 #546c7a 57%,#0d1b29 68%,#536e7b 82%,#b6c6cd 92%,#0b131b 100%);
 box-shadow:inset 0 0 15px #fff8;filter:drop-shadow(0 0 14px #8da9bc2b)}
.iridescence{transform:translateZ(3px);mix-blend-mode:screen;opacity:.55;
 background:linear-gradient(112deg,transparent 3%,#62d1cf1e 24%,transparent 31%,#e5d9ff32 53%,transparent 67%,#9bcced1b 85%,transparent 100%)}
.specular{transform:translateZ(4px);mix-blend-mode:screen;opacity:.86;
 background:linear-gradient(112deg,transparent 22%,#e7faff00 38%,#edfbff93 46%,#fff 49%,#d8fcff66 52%,transparent 64%);
 background-size:235% 100%;background-position:var(--specular,76%) 50%;will-change:background-position}
.rim{transform:translateZ(4.8px);opacity:.45;mix-blend-mode:screen;
 background:linear-gradient(118deg,#e0f7ffba 0%,transparent 19%,transparent 67%,#f1ffff9c 89%,transparent 100%)}
.logo-3d::after{content:"";position:absolute;inset:-6%;z-index:-2;
 background:radial-gradient(ellipse,#b4eff728 0,#83b9c610 31%,transparent 68%);
 filter:blur(44px);transform:translateZ(-52px)}
.authentic-src{position:absolute;width:100%;height:100%;inset:0;object-fit:contain;
 opacity:.96;filter:invert(1);mix-blend-mode:screen;transition:opacity .5s ease}
body.mask-ready .authentic-src{opacity:0}
body:not(.mask-ready) .surface,body:not(.mask-ready) .layer,
body:not(.mask-ready) .iridescence,body:not(.mask-ready) .specular,body:not(.mask-ready) .rim{opacity:0}
.title-block{margin-top:clamp(18px,3vh,36px);text-align:center;position:relative;
 transform:translateY(20px);opacity:0;animation:title-enter 1.8s cubic-bezier(.17,1,.24,1) 1s forwards}
h1{margin:0 0 0 .38em;text-transform:uppercase;color:#f2f6f8;
 letter-spacing:.38em;line-height:1.3;font-weight:450;
 font-size:clamp(16px,2vw,23px);text-shadow:0 0 28px #d8ecfa20;
 background:linear-gradient(92deg,#99aebb 3%,#e9f2f5 36%,#fff 51%,#b1c7d2 67%,#849ba9 100%);
 background-size:230% 100%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
 animation:text-gloss 12s ease-in-out 2s infinite}
.title-block::after{content:"";display:block;height:1px;width:clamp(90px,18vw,152px);
 background:linear-gradient(90deg,transparent,#a4c4d18c,transparent);
 margin:24px auto 0;box-shadow:0 0 22px #97bece30}
@keyframes materialize{
 0%{opacity:0;filter:blur(21px);transform:translateY(95px) rotateX(28deg) rotateY(-44deg) scale(.73)}
 52%{opacity:1;filter:blur(1px)}100%{opacity:1;filter:blur(0);transform:translateY(0) rotateX(0deg) rotateY(-11deg) scale(1)}}
@keyframes title-enter{to{opacity:1;transform:translateY(0)}}
@keyframes text-gloss{0%,28%,100%{background-position:110% 0}52%{background-position:-82% 0}}
@keyframes ambient-turn{to{transform:rotate(360deg)}}
@keyframes light-sweep{0%,100%{transform:translateX(-7%) rotate(-8deg);opacity:.18}
 55%{transform:translateX(9%) rotate(-3deg);opacity:.65}}
@keyframes halo-breathe{50%{opacity:.58;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes orbit-a{to{transform:translate(-50%,-50%) rotateX(72deg) rotateZ(49deg);opacity:.29}}
@keyframes orbit-b{to{transform:translate(-50%,-50%) rotateX(67deg) rotateZ(-46deg);opacity:.26}}
@keyframes floor-pulse{50%{opacity:.35;transform:translateX(-50%) scaleX(1.12)}}
@media(max-width:700px){
 .content{transform:translateY(-3vh)}
 .logo-space{width:94vw;height:clamp(265px,78vw,405px)}
 .logo-3d{width:100%}
 .stage{background:radial-gradient(ellipse 72% 35% at 50% 43%,#27313b 0%,#121b27 51%,#080c13 100%)}
 .orbit-a{width:124vw}.orbit-b{width:151vw}
 .title-block{margin-top:clamp(8px,2.3vh,23px)}
 h1{font-size:clamp(15px,4.4vw,19px);letter-spacing:.32em;margin-left:.32em}
 .title-block::after{margin-top:19px}
 .reflection-floor{top:62%;height:120px}
}
@media(max-height:560px) and (min-width:701px){
 .logo-space{height:56vh;width:min(66vh,600px)}.title-block{margin-top:8px}
 .content{transform:translateY(-2vh)}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*::before,*::after{animation:none!important;transition:none!important}
 .mount{opacity:1;transform:none!important;filter:none!important}
 .title-block{opacity:1;transform:none!important}
 .specular{background-position:60% 50%}
}
</style>
</head>

let targetX=0,targetY=0,scroll=0,currentX=0,currentY=-11,gestureX=0,gestureY=0,lastTick=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const layers=document.createDocumentFragment();
for(let i=22;i>=0;i--){
 const layer=document.createElement('div');layer.className='layer';
 layer.style.setProperty('--z',(-i*1.72).toFixed(2)+'px');
 layer.style.setProperty('--brightness',(0.63+(22-i)*.012).toFixed(2));
 layers.appendChild(layer);
}
stack.replaceWith(layers);
function makeExactMask(){
 if(!source.complete||!source.naturalWidth)return;
 try{
  const w=source.naturalWidth,h=source.naturalHeight;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,0,0);
  const data=ctx.getImageData(0,0,w,h);
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4; const r=data.data[i],g=data.data[i+1],b=data.data[i+2];
   const darkness=255-(.2126*r+.7152*g+.0722*b);
   // This is ATHLTH's ORIGINAL pixel silhouette, not a reconstructed SVG.
   data.data[i]=255;data.data[i+1]=255;data.data[i+2]=255;
   data.data[i+3]=Math.round(clamp(darkness*1.06,0,255));
   if(darkness>42){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  }
  if(x1<=x0||y1<=y0)return;
  ctx.putImageData(data,0,0);
  const pad=Math.round(w*.008),cx=Math.max(0,x0-pad),cy=Math.max(0,y0-pad);
  const cw=Math.min(w-cx,x1-x0+1+2*pad),ch=Math.min(h-cy,y1-y0+1+2*pad);
  const crop=document.createElement('canvas');crop.width=cw;crop.height=ch;
  crop.getContext('2d').drawImage(cv,cx,cy,cw,ch,0,0,cw,ch);
  const uri=crop.toDataURL('image/png');
  document.documentElement.style.setProperty('--logo-mask','url("'+uri+'")');
  logo.style.aspectRatio=cw+'/'+ch;
  document.body.classList.add('mask-ready');
  source.removeAttribute('decoding');
 }catch(e){ /* Original image is still presented if canvas is unavailable. */ }
}
source.addEventListener('load',makeExactMask,{once:true});
if(source.complete&&source.naturalWidth)makeExactMask();
function getScroll(){
 const total=Math.max(1,document.documentElement.scrollHeight-innerHeight);
 scroll=clamp(scrollY/total,0,1);
}
getScroll();
window.addEventListener('scroll',getScroll,{passive:true});
window.addEventListener('resize',getScroll,{passive:true});
const point=e=>{
 const r=stage.getBoundingClientRect();
 targetX=clamp(((e.clientX-r.left)/Math.max(1,r.width)-.5)*2,-1,1);
 targetY=clamp(((e.clientY-r.top)/Math.max(1,r.height)-.5)*2,-1,1);
};
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!reduced.matches){
 stage.addEventListener('pointermove',point,{passive:true});
 stage.addEventListener('pointerleave',()=>{targetX=targetY=0;});
}
if(!reduced.matches){
 stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')point(e)},{passive:true});
 stage.addEventListener('pointerup',()=>{targetX=targetY=0},{passive:true});
 function frame(t){
  const dt=lastTick?Math.min(.1,(t-lastTick)/1000):.016;lastTick=t;
  const easing=1-Math.exp(-dt*4.4);
  const idleX=Math.sin(t*.00039)*2.6,idleY=Math.sin(t*.00027)*4;
  const tx=idleX-targetY*16+scroll*12;
  const ty=-11+idleY+targetX*25+scroll*65;
  currentX+=(tx-currentX)*easing;currentY+=(ty-currentY)*easing;
  mount.style.transform='rotateX('+currentX.toFixed(2)+'deg) rotateY('+currentY.toFixed(2)+'deg) translateZ('+(scroll*13).toFixed(2)+'px)';
  const sx=clamp(52-targetX*23-scroll*22+Math.sin(t*.00028)*7,8,93);
  const sy=clamp(35+targetY*24+scroll*17,5,90);
  document.documentElement.style.setProperty('--shine-x',sx.toFixed(2)+'%');
  document.documentElement.style.setProperty('--shine-y',sy.toFixed(2)+'%');
  document.documentElement.style.setProperty('--specular',clamp(81-targetX*36-scroll*54+Math.sin(t*.00013)*11,0,100).toFixed(2)+'%');
  requestAnimationFrame(frame);
 }
 setTimeout(()=>requestAnimationFrame(frame),2600);
}
})();
</script>
