name: ATHLTH
options:
  bundleIdPrefix: com.wesc9
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.5.2"
    CURRENT_PROJECT_VERSION: "54"
    DEVELOPMENT_TEAM: D3AX7B6RMW
targets:
  ATHLTH:
    type: application
    platform: iOS
    sources:
      - path: ATHLTH
      - path: Shared
    dependencies:
      - target: ATHLTHWatchApp
        embed: true
      - target: ATHLTHWidgets
        embed: true
      - package: Supabase
      - package: SpotifyiOS
    info:
      path: ATHLTH/Resources/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: "ATHLTH reads workouts, sleep, heart rate, activity and related Health data to provide your training history, recovery insights and workout metrics."
        NSHealthUpdateUsageDescription: "ATHLTH saves workouts and related training data to Apple Health so workouts recorded with ATHLTH and Apple Watch stay in sync."
        NSLocationWhenInUseUsageDescription: "ATHLTH uses location while Around You is open to center the map and find nearby routes and events, and during location-based workout features you choose to use."
        UIBackgroundModes: [location]
        NSCalendarsFullAccessUsageDescription: "ATHLTH creates a dedicated training calendar and keeps your planned workouts synchronized with Calendar."
        NSCalendarsUsageDescription: "ATHLTH uses calendar access to show your planned workouts in a dedicated ATHLTH calendar."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        ATHLTHLegalOperatorName: "$(ATHLTH_LEGAL_OPERATOR_NAME)"
        ATHLTHPrivacyContactEmail: "$(ATHLTH_PRIVACY_CONTACT_EMAIL)"
        ATHLTHSupportURL: "$(ATHLTH_SUPPORT_URL)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.wesc9.athlth.auth
            CFBundleURLSchemes:
              - athlth
          - CFBundleURLName: com.wesc9.athlth.spotify
            CFBundleURLSchemes:
              - athlth-spotify-login
        LSApplicationQueriesSchemes:
          - spotify
        ATHLTHSpotifyClientID: "$(ATHLTH_SPOTIFY_CLIENT_ID)"
        ATHLTHSpotifyRedirectURI: "athlth-spotify-login://callback"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth
        PRODUCT_NAME: ATHLTH
        ATHLTH_LEGAL_OPERATOR_NAME: ""
        ATHLTH_PRIVACY_CONTACT_EMAIL: ""
        ATHLTH_SUPPORT_URL: ""
        ATHLTH_SPOTIFY_CLIENT_ID: "d041cc7596a84f80be94e884a98b26ac"
        CODE_SIGN_ENTITLEMENTS: ATHLTH/Resources/ATHLTH.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - ATHLTHTests

  ATHLTHWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ATHLTHWidgets
        excludes:
          - ATHLTHWidgets.entitlements
          - Info.plist
      - path: Shared/ATHLTHSurfaceSnapshot.swift
      - path: Shared/ATHLTHLiveWorkoutSurfaceModels.swift
      - path: ATHLTH/Surfaces/ATHLTHWorkoutActivityAttributes.swift
    info:
      path: ATHLTHWidgets/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.widgets
        PRODUCT_NAME: ATHLTHWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ATHLTHWidgets/ATHLTHWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  ATHLTHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ATHLTH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.tests

  ATHLTHWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ATHLTHWatchApp
      - path: ATHLTHWatchExtension
        excludes:
          - Info.plist
          - ATHLTHWatchExtension.entitlements
      - path: Shared
    dependencies:
      - target: ATHLTHWatchWidgets
        embed: true
    info:
      path: ATHLTHWatchExtension/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wesc9.athlth
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: "ATHLTH reads live heart rate, energy, distance and workout data to show your training metrics on Apple Watch."
        NSHealthUpdateUsageDescription: "ATHLTH saves workouts and workout routes from Apple Watch to Apple Health so your training history stays complete."
        NSLocationWhenInUseUsageDescription: "ATHLTH uses your location during outdoor workouts to record your route and, when available, to save the place where an indoor workout such as strength was performed."
        CFBundleURLTypes:
          - CFBundleURLName: com.wesc9.athlth.watch
            CFBundleURLSchemes:
              - athlth-watch
        WKBackgroundModes:
          - workout-processing
          - audio
        WKSupportsAlwaysOnDisplay: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.watchkitapp
        PRODUCT_NAME: ATHLTH
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ATHLTHWatchExtension/ATHLTHWatchExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Finalize single-target Watch Info.plist
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :WKApplication true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKApplication bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.wesc9.athlth" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKCompanionAppBundleIdentifier string com.wesc9.athlth" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :WKRunsIndependentlyOfCompanionApp false" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :WKRunsIndependentlyOfCompanionApp bool false" "$PLIST"

  ATHLTHWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ATHLTHWatchWidgets
        excludes:
          - Info.plist
    info:
      path: ATHLTHWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: ATHLTH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesc9.athlth.watchkitapp.widgets
        PRODUCT_NAME: ATHLTHWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

