name: ATHLTH iPad Compatibility Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
      - release/v1.4.4
      - release/v1.4.6
      - release/v1.5.1
      - release/v1.5.2
      - release/v1.5.3
      - release/v1.6.9
      - release/v1.7.2
      - release/v1.7.3
      - release/v1.7.4
      - release/v1.7.5
      - release/v1.7.6
      - release/v1.7.8
      - release/v1.7.9
      - release/v1.8.0
      - release/v1.8.1
      - release/v1.8.2
      - release/v1.8.3
      - release/v2.0.0
      - release/v2.0.1
      - release/v2.0.3
      - release/v2.0.4
      - release/v2.0.5
      - release/v2.0.6
      - release/v2.0.7
      - release/v2.0.8
      - release/v2.0.9
      - release/v2.1.0
      - release/v2.1.2
      - release/v2.1.3
      - release/v2.1.4
      - release/v2.1.5
      - release/v2.1.8
      - release/v2.1.9
      - release/v2.2.0
      - release/v2.2.1
      - release/v2.2.2
      - release/v2.2.3
      - release/v2.2.4
      # release/v2.2.5 is validated by Build ATHLTH after XCTest.
      # Keep older branches and manual dispatch as independent fallbacks.
    paths:
      - ATHLTH/Planning/ATHLTHIntervalGroupAdjustmentView.swift
      - ATHLTH/Planning/ATHLTHPlannedWorkoutStudioView.swift
      - ATHLTH/Planning/ATHLTHIntervalRecipeEditing.swift
      - Tests/ATHLTHIntervalRecipeEditingTests.swift
      - ATHLTH/**/*.swift
      - ATHLTH/Assets.xcassets/**
      - Shared/**/*.swift
      - ATHLTHWidgets/**/*.swift
      - ATHLTHWidgets/Localizable.xcstrings
      - project.yml
      - scripts/optimize_hero_assets.sh
      - .github/workflows/ipad-smoke.yml
      - .github/ipad-trigger

concurrency:
  group: athlth-ipad-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipad-smoke:
    runs-on: xcode-27
    # Fallback-only job; release/v2.2.5 uses its existing XCTest build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install validation tools
        run: |
          brew install xcodegen
          brew install imagemagick

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Embed RepDB offline exercise assets
        run: python3 scripts/prepare_repdb_offline.py

      - name: Generate iPad smoke-test project
        shell: bash
        run: |
          set -euo pipefail
          cp project.yml project-ipad-smoke.yml
          python3 - project-ipad-smoke.yml <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("      - target: ATHLTHWatchApp\n        embed: true\n", "")
          path.write_text(text)
          PY
          xcodegen generate --spec project-ipad-smoke.yml

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 3 \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch onboarding and all main tabs on iPad
        shell: bash
        run: bash scripts/run_ipad_smoke.sh

      - name: Upload iPad smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-ipad-smoke-screenshots
          path: ${{ runner.temp }}/athlth-ipad-*.png
          if-no-files-found: warn
          retention-days: 7