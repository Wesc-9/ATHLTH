<title>ATHLTH — Coming soon</title>
<style>
:root{
  color-scheme:dark;
  --background:#050507;
  --foreground:#f9f9fb;
  --silver-hi:#f5f5f7;
  --silver-mid:#e1e2e6;
  --silver-lo:#b5b8c0;
  --pulse:#e4e9f0;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--background);scroll-behavior:auto}
body{
  margin:0;min-width:280px;overflow-x:hidden;
  background:var(--background);color:var(--foreground);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.journey{height:280svh;min-height:680px;position:relative}
.hero{
  position:sticky;top:0;height:100svh;min-height:360px;
  overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;
  perspective:900px;background:#050507;
}
.spotlight{
  pointer-events:none;position:absolute;inset:0;z-index:-2;
  background:radial-gradient(ellipse 55% 45% at 50% 45%,rgba(255,255,255,.068),transparent 70%);
  opacity:.6;
}
.vignette{
  pointer-events:none;position:absolute;inset:0;z-index:3;
  background:radial-gradient(ellipse 90% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
}
.dust-field{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dust{
  position:absolute;top:0;left:0;width:2px;height:2px;
  border-radius:50%;background:var(--silver-hi);
  box-shadow:0 0 6px rgba(255,255,255,.4);
  opacity:0;will-change:transform,opacity;
}
.center{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:32px 24px;
  transform:translateY(-2.5svh);
}
.logo-mark{
  width:clamp(9rem,34vw,17rem);
  position:relative;flex:none;
  transform-style:preserve-3d;will-change:transform;
}
.logo-svg{position:relative;width:100%;height:auto;display:block;overflow:visible}
.halo{
  width:150%;aspect-ratio:1;position:absolute;left:50%;top:50%;
  border-radius:50%;pointer-events:none;opacity:.35;
  background:radial-gradient(circle,rgba(255,255,255,.09),rgba(255,255,255,.03) 40%,transparent 68%);
  transform:translate(-50%,-50%) scale(.5);
  will-change:transform,opacity;
}
.ecg-line{
  position:absolute;top:72.2%;height:1px;width:60vw;
  transform:scaleX(0);background:linear-gradient(90deg,transparent,var(--silver-mid));
  opacity:1;pointer-events:none;will-change:transform,opacity;
}
.ecg-left{right:95.6%;transform-origin:left}
.ecg-right{left:95.6%;transform-origin:left;background:linear-gradient(90deg,var(--silver-mid),transparent)}
.logo-mark::before,.logo-mark::after{
  content:"";position:absolute;left:50%;top:50%;
  width:140%;aspect-ratio:1;border:1px solid var(--pulse);
  border-radius:50%;transform:translate(-50%,-50%) scale(.4);
  opacity:0;pointer-events:none;
}
.logo-mark.is-beating .logo-svg{animation:heartbeat 2.4s ease-in-out infinite}
.logo-mark.is-beating::before{animation:wave 2.4s ease-out infinite}
.logo-mark.is-beating::after{animation:wave 2.4s ease-out .28s infinite}
.text-slot{
  display:grid;place-items:center;
  margin-top:clamp(25px,4.5vmin,37px);
  min-height:25px;
  width:100%;
  text-align:center;
}
.brand,.coming{
  grid-area:1 / 1;
  margin:0;
  padding-left:.34em;
  color:rgba(248,248,250,.92);
  font-size:clamp(12px,1.55vmin,15px);
  font-weight:500;
  letter-spacing:.34em;
  line-height:1.6;
  white-space:nowrap;
  transform:translateZ(0);
  will-change:opacity,filter;
}
.coming{
  opacity:0;
  color:rgba(224,224,230,.76);
}
body:not(.enhanced) .coming{display:none}
/* ATHLTH begins at zero opacity, then fades in smoothly from page load. */
body.enhanced .brand{opacity:0}
@keyframes heartbeat{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}
  8%{transform:scale(1.028);filter:drop-shadow(0 0 12px rgba(255,255,255,.23))}
  16%{transform:scale(1)}
  24%{transform:scale(1.016);filter:drop-shadow(0 0 9px rgba(255,255,255,.17))}
  40%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}
}
@keyframes wave{
  0%{opacity:.22;transform:translate(-50%,-50%) scale(.45)}
  70%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}
@media(min-width:768px){.journey{height:360svh}}
@media(max-width:640px){
  .logo-mark{width:clamp(9rem,41vw,12.5rem)}
  .center{transform:translateY(-1.6svh)}
  .ecg-line{width:52vw}
  .text-slot{margin-top:26px}
  .brand,.coming{font-size:12px;letter-spacing:.32em;padding-left:.32em}
}
@media(prefers-reduced-motion:reduce){
  .journey{height:100svh;min-height:360px}
  .logo-mark,.halo,.ecg-line,.brand,.coming,.dust,.logo-svg{
    animation:none!important;transition:none!important;will-change:auto!important;
  }
  .logo-mark::before,.logo-mark::after{animation:none!important;opacity:0!important}
  .dust{display:none!important}
  .halo{transform:translate(-50%,-50%) scale(1)!important;opacity:1!important}
  .brand{opacity:0!important;filter:none!important;transform:none!important;will-change:auto!important}
  .coming{display:block!important;opacity:1!important;filter:none!important;transform:none!important;will-change:auto!important}
  .ecg-line{transform:scaleX(1)!important;opacity:.22!important}
}
</style>
</head>

  const right=document.getElementById('line-right');
  const coming=document.getElementById('coming');
  const brand=document.getElementById('brand');
  const dustField=document.getElementById('dust-field');
  const a=document.getElementById('path-a');
  const b=document.getElementById('path-b');
  const sa=document.getElementById('sweep-a');
  const sb=document.getElementById('sweep-b');
  const sweep=document.getElementById('sweep');
  if(!stage||!a||!b||!sa||!sb)return;
  const clamp=v=>Math.min(1,Math.max(0,v));
  const ease=t=>1-Math.pow(1-t,3);
  const silk=t=>t*t*t*(t*(t*6-15)+10);
  const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const fine=window.matchMedia('(hover: hover) and (pointer: fine)');
  const lenA=a.getTotalLength(),lenB=b.getTotalLength();
  [a,sa].forEach(el=>{el.style.strokeDasharray=String(lenA);el.style.strokeDashoffset=String(lenA);});
  [b,sb].forEach(el=>{el.style.strokeDasharray=String(lenB);el.style.strokeDashoffset=String(lenB);});
  const seeds=[];
  for(let i=0;i<26;i++){
    const random=n=>{
      const x=Math.sin(i*127.1+n*311.7)*43758.5453;
      return x-Math.floor(x);
    };
    seeds.push({x:random(1)*100,y:random(2)*100,d:.3+random(4)*.7,o:.12+random(5)*.3});
    const particle=document.createElement('span');particle.className='dust';
    particle.style.width=(1+random(3)*2.2).toFixed(2)+'px';
    particle.style.height=particle.style.width;
    dustField.appendChild(particle);
  }
  const dust=Array.from(dustField.children);
  document.body.classList.add('enhanced');

  let current=0,auto=null,autoStart=0,userScrolled=false,frame=0,last=0,px=0,py=0,tx=0,ty=0;
  const timeOrigin=performance.now();
  const onMove=e=>{
    if(!fine.matches||motion.matches)return;
    tx=(e.clientX/window.innerWidth-.5)*2;
    ty=(e.clientY/window.innerHeight-.5)*2;
  };
  const scrollProgress=()=>{
    const max=stage.offsetHeight-window.innerHeight;
    return max>0?clamp(window.scrollY/max):0;
  };
  const onScroll=()=>{
    if(window.scrollY>4){userScrolled=true;auto=null;}
  };
  window.addEventListener('pointermove',onMove,{passive:true});
  window.addEventListener('scroll',onScroll,{passive:true});

  function render(p,now,still){
    const draw=silk(clamp(p/.4));
    const dA=clamp(draw/.6),dB=clamp((draw-.45)/.55);
    a.style.strokeDashoffset=String(lenA*(1-dA));
    b.style.strokeDashoffset=String(lenB*(1-dB));
    sa.style.strokeDashoffset=String(lenA*(1-dA));
    sb.style.strokeDashoffset=String(lenB*(1-dB));
    left.style.transform='scaleX('+silk(clamp(p/.15))+')';
    right.style.transform='scaleX('+silk(clamp((p-.28)/.15))+')';

    const fill=silk(clamp((p-.4)/.22));
    const width=2+fill*23;
    [a,b,sa,sb].forEach(el=>el.setAttribute('stroke-width',width.toFixed(3)));
    left.style.opacity=String(1-fill*.75);
    right.style.opacity=String(1-fill*.75);

    const sweepP=clamp((p-.5)/.3);
    sweep.setAttribute('gradientTransform','translate('+(-1.2+sweepP*2.4).toFixed(3)+' 0)');
    const shine=sweepP>0&&sweepP<1?'1':'0';
    sa.style.opacity=shine;sb.style.opacity=shine;

    const breath=still?1:1+Math.sin(now/1400)*.04;
    const size=(.5+ease(clamp(p/.6))*.6)*breath;
    halo.style.transform='translate(-50%,-50%) scale('+size.toFixed(4)+')';
    halo.style.opacity=String(.35+ease(clamp((p-.35)/.4))*.65);
    spot.style.opacity=String(.6+ease(clamp((p-.3)/.5))*.4);

    if(still){px=py=0;}else{
      px+=(tx-px)*.045;py+=(ty-py)*.045;
    }
    const settle=1-ease(clamp((p-.85)/.15))*.04;
    mark.style.transform=still?'none':('translate3d('+(px*10).toFixed(3)+'px,'+(py*8).toFixed(3)+'px,0) rotateX('+(-py*3).toFixed(3)+'deg) rotateY('+(px*4).toFixed(3)+'deg) scale('+settle.toFixed(4)+')');

    if(still){
      dust.forEach(el=>el.style.display='none');
    }else{
      dust.forEach((el,i)=>{
        const sd=seeds[i];
        const drift=((now/90+sd.y*10)%120)-10;
        el.style.transform='translate3d('+(sd.x+px*6*sd.d).toFixed(3)+'vw,'+(sd.y-drift*.35+py*4*sd.d).toFixed(3)+'vh,0)';
        el.style.opacity=String(sd.o*(.5+ease(clamp(p/.5))*.5));
      });
    }
    mark.classList.toggle('is-beating',p>.6&&!still);
    // ATHLTH fades in from page load while the symbol draws.
    // The existing scroll-driven crossfade to COMING SOON is unchanged.
    const reveal=still?0:silk(clamp((now-timeOrigin)/1450));
    const swap=still?1:silk(clamp((p-.72)/.20));
    brand.style.opacity=String(reveal*(1-swap));
    coming.style.opacity=String(swap);
    brand.style.filter='blur('+((1-reveal)*3+swap*2).toFixed(2)+'px)';
    coming.style.filter='blur('+((1-swap)*2).toFixed(2)+'px)';
  }
  if(motion.matches){
    render(1,timeOrigin,true);
    return;
  }
  if(window.scrollY>4)userScrolled=true;
  function loop(now){
    if(document.hidden){frame=0;last=0;return;}
    const elapsed=now-timeOrigin;
    if(!userScrolled&&auto===null&&elapsed>2500){auto=0;autoStart=now;}
    if(auto!==null)auto=clamp((now-autoStart)/5200);
    const intro=clamp(elapsed/1800)*.08;
    const target=Math.max(intro,auto===null?scrollProgress():auto);
    // Compensate for refresh rates so 60/120Hz have a similar easing.
    const dt=last?Math.min(now-last,70):16.67;
    last=now;
    const smoothing=1-Math.pow(1-.06,dt/16.67);
    current+=(target-current)*smoothing;
    render(current,now,false);
    frame=requestAnimationFrame(loop);
  }
  frame=requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&!frame){last=0;frame=requestAnimationFrame(loop);}
  });
  function onMotionChange(){
    if(motion.matches){
      cancelAnimationFrame(frame);frame=0;
      mark.classList.remove('is-beating');render(1,performance.now(),true);
    }else if(!frame){
      dust.forEach(el=>el.style.display='');
      last=0;frame=requestAnimationFrame(loop);
    }
  }
  if(motion.addEventListener)motion.addEventListener('change',onMotionChange);
})();
</script>
</body>
</html>
