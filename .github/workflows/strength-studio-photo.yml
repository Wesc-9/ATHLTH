name: Bundle full-resolution strength studio photograph
on:
  push:
    branches:
      - release/v1.9.1
    paths:
      - .github/workflows/strength-studio-photo.yml
permissions:
  contents: write
jobs:
  bundle-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.9.1
          persist-credentials: true
      - name: Replace low-resolution placeholder with licensed HD gym photograph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          curl --fail --location --retry 3 --max-time 90 \
            'https://images.unsplash.com/photo-1757924284732-4189190321cf?auto=format&fit=crop&fm=jpg&q=88&w=2800' \
            -o /tmp/athlth-gym-download.jpg
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          original = Image.open('/tmp/athlth-gym-download.jpg')
          if original.width < 2000 or original.height < 1000:
              raise SystemExit(f'HD photo required, received {original.size}')
          photo = ImageOps.fit(original.convert('RGB'), (2400, 1350), centering=(0.5, 0.5), method=Image.Resampling.LANCZOS)
          photo = ImageEnhance.Color(photo).enhance(0.82)
          photo = ImageEnhance.Brightness(photo).enhance(1.08)
          target = Path('ATHLTH/Assets.xcassets/StrengthFeedGym.imageset/gym.jpg')
          photo.save(target, 'JPEG', quality=88, optimize=True, progressive=True)
          if target.stat().st_size < 150_000:
              raise SystemExit('Photo unexpectedly small, refusing low-resolution replacement')
          print(f'ATHLTH strength studio: {photo.size}, {target.stat().st_size} bytes')
          PY
          cat > ATHLTH/Assets.xcassets/StrengthFeedGym.imageset/PHOTO_SOURCE.txt <<'EOF'
          Image: Modern gym with treadmills and large windows
          Photographer: Aalo Lens / Unsplash
          Source: https://unsplash.com/photos/modern-gym-with-treadmills-and-large-windows-uYnHRrm63uo
          License: Unsplash License (free commercial use)
          Bundled for offline use, 2400 x 1350 JPEG.
          EOF
      - name: Commit only the approved gym photograph and its attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ATHLTH/Assets.xcassets/StrengthFeedGym.imageset/gym.jpg ATHLTH/Assets.xcassets/StrengthFeedGym.imageset/PHOTO_SOURCE.txt
          git commit -m '1.9.1: bundle 2400px licensed premium bright gym photo for strength cards'
          git pull --rebase origin release/v1.9.1
          git push origin HEAD:release/v1.9.1
