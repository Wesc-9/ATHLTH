name: ATHLTH iPhone Compatibility Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.4.3
      - release/v1.4.4
      - release/v1.4.6
      - release/v1.5.1
      - release/v1.5.2
      - release/v1.5.3
      - release/v1.6.9
      - release/v1.7.2
      - release/v1.7.3
      - release/v1.7.4
      - release/v1.7.5
      - release/v1.7.6
      - release/v1.7.7
      - release/v1.7.8
      - release/v1.7.9
      - release/v1.8.0
      - release/v1.8.1
      - release/v1.8.2
      - release/v1.8.3
      - release/v1.8.8
      - release/v1.8.9
      - release/v1.9.0
      - release/v1.9.1
      - release/v1.9.2
      - release/v1.9.9
      - release/v2.0.0
      - release/v2.0.1
      - release/v2.0.2
      - release/v2.0.3
      - release/v2.0.4
      - release/v2.0.5
      - release/v2.0.6
      - release/v2.0.7
      - release/v2.0.8
      - release/v2.0.9
      - release/v2.1.0
      - release/v2.1.1
      - release/v2.1.2
      - release/v2.1.3
      - release/v2.1.4
      - release/v2.1.8
      - release/v2.2.1
      - release/v2.2.2
      - release/v2.2.3
      - release/v2.2.4
      - release/v2.2.5
      - release/v2.2.6
      - release/v2.2.7
      - release/v2.2.8
      - release/v2.2.9
      - release/v2.3.0
      - release/v3.0.0
      - release/v3.0.1
    paths:
      - ATHLTH/**/*.swift
      - ATHLTHWidgets/**/*.swift
      - Shared/ATHLTHBrandMark.swift
      - ATHLTH/Assets.xcassets/**
      - Shared/**/*.swift
      - project.yml
      - scripts/optimize_hero_assets.sh
      - .github/workflows/launch-smoke.yml
      - .github/testflight-trigger
      - .github/release-validation-trigger
      - .github/workflows/hybrid-engine-tests.yml
      - Tests/ATHLTHPlannedHybridLaunchTests.swift
      - Tests/ATHLTHUnifiedMixedWorkoutPlanTests.swift
      - Tests/ATHLTHLiveWorkoutEngineRouterTests.swift
      - Tests/StrengthActiveExerciseQueueTests.swift
      - .github/launch-trigger

concurrency:
  group: athlth-iphone-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-smoke-app:
    name: Build shared iPhone simulator app
    runs-on: xcode-27
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Verify Insights main-tab and preview routing
        run: python3 scripts/audit_insights_entrypoints.py

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Install validation tools
        run: |
          brew install xcodegen

      - name: Optimize hero assets for runtime memory
        shell: bash
        run: bash scripts/optimize_hero_assets.sh

      - name: Embed RepDB offline exercise assets
        run: python3 scripts/prepare_repdb_offline.py

      - name: Generate iPhone-only smoke-test project
        shell: bash
        run: |
          set -euo pipefail
          cp project.yml project-smoke.yml
          python3 - project-smoke.yml <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("      - target: ATHLTHWatchApp\n        embed: true\n", "")
          path.write_text(text)
          PY
          xcodegen generate --spec project-smoke.yml

      - name: Build simulator app
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          # Keep an on-runner build log and periodic progress output so a
          # stalled Xcode build can be distinguished from a slow compile.
          # Smoke tests validate launch and rendering; Release compilation is
          # already verified separately by the required Build ATHLTH gate.
          LOG="$RUNNER_TEMP/athlth-iphone-simulator-build.log"
          set +e
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            -jobs 2 \
            build > "$LOG" 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            echo "::notice::iPhone simulator build still running (PID $build_pid)"
            tail -n 12 "$LOG" || true
          done
          wait "$build_pid"
          result=$?
          set -e
          tail -n 120 "$LOG" || true
          exit "$result"

      - name: Upload iPhone simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-build-log
          path: ${{ runner.temp }}/athlth-iphone-simulator-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package exact-commit simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ATHLTH.app"
          test -x "$APP/ATHLTH"
          mkdir -p "$RUNNER_TEMP/athlth-smoke-package"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/athlth-smoke-package/ATHLTH.zip"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/athlth-smoke-package/commit.txt"
          lipo -archs "$APP/ATHLTH" > "$RUNNER_TEMP/athlth-smoke-package/architectures.txt"
          (cd "$RUNNER_TEMP/athlth-smoke-package" && shasum -a 256 ATHLTH.zip > SHA256SUMS)

      - name: Upload shared simulator app
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-simulator-app
          overwrite: true
          path: ${{ runner.temp }}/athlth-smoke-package/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  launch-smoke:
    name: iPhone smoke (${{ matrix.size }})
    needs: build-smoke-app
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Separate jobs, with bounded concurrency on the Xcode runner pool.
      max-parallel: 1
      matrix:
        size: [standard, large, compact, mini]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Insights main-tab and preview routing
        run: python3 scripts/audit_insights_entrypoints.py

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Discover compatible device for this isolated job
        id: device
        shell: bash
        env:
          SIZE: ${{ matrix.size }}
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          vm_stat
          python3 - <<'PY'
          import pathlib, subprocess, os
          data = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], timeout=60)
          pathlib.Path(os.environ["RUNNER_TEMP"], "athlth-iphone-devices.json").write_bytes(data)
          PY
          python3 scripts/select_iphone_simulators.py < "$RUNNER_TEMP/athlth-iphone-devices.json" > "$RUNNER_TEMP/iphone-device-matrix-all.txt"
          awk -F'|' -v size="$SIZE" '$1 == size' "$RUNNER_TEMP/iphone-device-matrix-all.txt" > "$RUNNER_TEMP/iphone-device-matrix.txt"
          if [ ! -s "$RUNNER_TEMP/iphone-device-matrix.txt" ]; then
            case "$SIZE" in
              compact|mini)
                echo "::notice::No compatible $SIZE device on this installed runtime; no coverage claimed."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *) echo "::error::Required $SIZE iPhone is unavailable."; exit 1 ;;
            esac
          fi
          test "$(wc -l < "$RUNNER_TEMP/iphone-device-matrix.txt" | tr -d ' ')" = 1
          echo "available=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/iphone-device-matrix.txt"

      - name: Install screenshot validation tools
        if: steps.device.outputs.available == 'true'
        run: brew install imagemagick

      - name: Download shared simulator app
        if: steps.device.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          # The successful build job might be from an earlier workflow
          # attempt when only failed device jobs are retried. Resolve its
          # artifact explicitly using a stable run-scoped name.
          name: athlth-iphone-simulator-app
          path: ${{ runner.temp }}/athlth-smoke-package

      - name: Verify and unpack exact-commit simulator app
        if: steps.device.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/athlth-smoke-package"
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          shasum -a 256 -c SHA256SUMS
          grep -qw "$(uname -m)" architectures.txt
          mkdir -p "$RUNNER_TEMP/athlth-shared-app"
          ditto -x -k ATHLTH.zip "$RUNNER_TEMP/athlth-shared-app"
          test -x "$RUNNER_TEMP/athlth-shared-app/ATHLTH.app/ATHLTH"
          df -h "$RUNNER_TEMP"
          vm_stat
          sysctl vm.loadavg vm.swapusage || true

      - name: Launch isolated iPhone and verify all tabs and 100 native transitions
        if: steps.device.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Bound CoreSimulator calls independently of the workflow timeout.
          # Preserve real app PID checks and the nonblank visual threshold.
          simctl_bounded() {
            local label="$1" seconds="$2"
            shift 2
            python3 - "$label" "$seconds" "$@" <<'PY'
          import subprocess, sys
          label, seconds = sys.argv[1], int(sys.argv[2])
          cmd = ["xcrun", "simctl", *sys.argv[3:]]
          print(f"::notice::iPhone simulator: {label} (limit {seconds}s)", file=sys.stderr, flush=True)
          try:
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=seconds)
          except subprocess.TimeoutExpired:
              print(f"::error::iPhone simulator timed out at {label} after {seconds}s", file=sys.stderr, flush=True)
              raise SystemExit(124)
          if result.stdout:
              print(result.stdout, end="", flush=True)
          if result.stderr:
              print(result.stderr, end="", file=sys.stderr, flush=True)
          if result.returncode:
              print(f"::error::iPhone simulator '{label}' failed ({result.returncode})", file=sys.stderr, flush=True)
          raise SystemExit(result.returncode)
          PY
          }

          # Discovery selects exactly one installed runtime-compatible size.
          DEVICE_MATRIX="$RUNNER_TEMP/iphone-device-matrix.txt"
          test -s "$DEVICE_MATRIX"
          cat "$DEVICE_MATRIX"

          # Use a new job-owned simulator with the exact registered type/runtime
          # rather than reusing potentially corrupted device storage.
          create_isolated_device() {
            local template="$1" spec runtime device_type new_udid
            spec=$(python3 - "$RUNNER_TEMP/athlth-iphone-devices.json" "$template" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          for runtime, group in devices.items():
              for device in group:
                  if device.get("udid") == sys.argv[2]:
                      kind = device.get("deviceTypeIdentifier")
                      if not kind:
                          raise SystemExit("Missing registered device type identifier")
                      print(runtime + "|" + kind)
                      raise SystemExit(0)
          raise SystemExit("Registered template device not found")
          PY
            ) || return 1
            IFS='|' read -r runtime device_type <<< "$spec"
            new_udid=$(simctl_bounded "create isolated $CLASS iPhone" 90 create "ATHLTH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CLASS" "$device_type" "$runtime") || return 1
            if ! [[ "$new_udid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              echo "::error::Invalid isolated simulator identifier" >&2
              return 1
            fi
            printf '%s\n' "$new_udid"
          }

          # The app was built in an earlier workflow step. Explicitly
          # resolve it in this shell; step-local variables are not inherited.
          APP="$RUNNER_TEMP/athlth-shared-app/ATHLTH.app"
          test -x "$APP/ATHLTH"

          cleanup_device() {
            local udid="$1"
            # Only delete the UUID returned by create_isolated_device.
            [ -n "$udid" ] || return 0
            simctl_bounded "shutdown isolated iPhone" 35 shutdown "$udid" >/dev/null 2>&1 || true
            simctl_bounded "delete isolated iPhone" 45 delete "$udid" >/dev/null 2>&1 || true
          }

          verify_train_dashboard_ready() {
            local udid="$1" pid="$2" label="$3"
            local container
            container=$(simctl_bounded "locate Train dashboard evidence" 45 get_app_container "$udid" com.wesc9.athlth data)
            test -n "$container"
            local marker="$container/tmp/athlth-train-$pid-dashboard-ready"
            local expected_transition="${4:-false}"
            local transition="$container/tmp/athlth-train-$pid-native-home-to-train"
            local first_hop="$container/tmp/athlth-train-$pid-native-first-hop-verified"
            local seconds=120
            if [ "$expected_transition" = true ]; then seconds=300; fi
            # Use monotonic elapsed time and check actual process/marker state.
            # A slow runner is not a pass; missing evidence and exits still fail.
            if python3 - "$pid" "$marker" "$transition" "$first_hop" "$expected_transition" "$seconds" <<'PY'
          import os, pathlib, sys, time
          pid, dashboard, transition, first, required, timeout = sys.argv[1:]
          pid = int(pid)
          markers = [pathlib.Path(dashboard)]
          if required == "true":
              markers += [pathlib.Path(transition), pathlib.Path(first)]
          start = time.monotonic()
          deadline = start + int(timeout)
          last = -30
          while True:
              try:
                  os.kill(pid, 0)
              except OSError:
                  print(f"ATHLTH process {pid} is not alive.", flush=True)
                  sys.exit(1)
              ready = [p.is_file() and p.stat().st_size > 0 for p in markers]
              if all(ready):
                  print(f"All {len(markers)} lifecycle markers verified after {time.monotonic()-start:.1f}s.", flush=True)
                  sys.exit(0)
              elapsed = time.monotonic() - start
              if elapsed - last >= 30:
                  print(f"Waiting {elapsed:.1f}s: {ready}", flush=True)
                  last = elapsed
              if time.monotonic() >= deadline:
                  sys.exit(2)
              time.sleep(1)
          PY
            then
              echo "Verified real Train Today dashboard mounted: $label (PID $pid)."
              return 0
            fi
            echo "Train lifecycle evidence for PID $pid:"
            find "$container/tmp" -maxdepth 1 -name "athlth-train-$pid-*" -print
            # Capture main-thread evidence first, before potentially blocked
            # simulator screenshot/log commands. Preserve partial diagnostics.
            {
              date -u
              vm_stat
              sysctl vm.loadavg vm.swapusage || true
              df -h "$RUNNER_TEMP"
              ps -p "$pid" -o pid,ppid,state,%cpu,%mem,etime,command || true
              ps -Ao pid,ppid,%cpu,%mem,comm -r | head -30 || true
            } > "$RUNNER_TEMP/athlth-$CLASS-train-host.txt" 2>&1
            python3 - "$pid" "$RUNNER_TEMP/athlth-$CLASS-train-sample.txt" <<'PY' || true
          import subprocess, sys
          with open(sys.argv[2], "w") as out:
              try:
                  subprocess.run(["sample", sys.argv[1], "5", "1"], stdout=out, stderr=subprocess.STDOUT, timeout=120, check=False)
              except subprocess.TimeoutExpired:
                  out.write("\nStack sampling exceeded 120s.\n")
          PY
            simctl_bounded "capture failed Train transition" 90 io "$udid" screenshot "$RUNNER_TEMP/athlth-$CLASS-train-failure.png" || true
            simctl_bounded "collect Train lifecycle logs" 65 spawn "$udid" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
            echo "::error::$label did not mount the real Train Today dashboard or perform the required native transition."
            return 1
          }

          validate_nonblank_screen() {
            local udid="$1"
            local screenshot="$2"
            local label="$3"
            local retry_mode="${4:-final}"
            local attempt=1
            local entropy="0"

            while [ "$attempt" -le 3 ]; do
              rm -f "$screenshot"
              if ! simctl_bounded "capture $label" 90 io "$udid" screenshot "$screenshot" || [ ! -s "$screenshot" ]; then
                echo "::warning::Screenshot transport unavailable ($label, attempt $attempt)."
                attempt=$((attempt + 1))
                sleep 5
                continue
              fi

              entropy=$(magick "$screenshot" -colorspace Gray -format "%[entropy]" info:)
              echo "$label screenshot entropy (attempt $attempt): $entropy"

              if python3 - "$entropy" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= 0.025 else 1)
          PY
              then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "$label still looks blank; waiting 8 seconds before retry."
                sleep 8
              fi

              attempt=$((attempt + 1))
            done

            if [ "$retry_mode" = "probe" ]; then
              echo "::warning::$label looks blank after initial checks (entropy=$entropy); relaunching once to distinguish a simulator rendering issue."
              return 1
            fi
            echo "::error::$label remained visually blank after relaunch and three more checks (entropy=$entropy)."
            simctl_bounded "collect $label logs" 65 spawn "$udid" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
            return 1
          }

          while IFS='|' read -r CLASS DEVICE_UDID DEVICE_NAME; do
            echo "Testing $CLASS layout on $DEVICE_NAME"

            UDID=""
            trap 'cleanup_device "$UDID"' EXIT
            UDID=$(create_isolated_device "$DEVICE_UDID")
            # Each job has a fresh, private device data container.
            # Only pre-launch infrastructure recovery may recreate the device.
            boot_ready=0
            for boot_attempt in 1 2 3; do
              echo "::notice::Boot check $boot_attempt/3 for $DEVICE_NAME"
              if simctl_bounded "boot registered $DEVICE_NAME" 95 boot "$UDID"; then
                echo "::notice::Boot requested for $DEVICE_NAME"
              else
                echo "::warning::Boot request failed or simulator was already booted."
              fi
              if simctl_bounded "wait for $DEVICE_NAME boot" 240 bootstatus "$UDID" -b; then
                if simctl_bounded "probe $DEVICE_NAME launch services" 50 spawn "$UDID" launchctl list > /dev/null; then
                  boot_ready=1
                  break
                fi
              fi
              echo "::warning::$DEVICE_NAME boot/probe failed on attempt $boot_attempt."
              {
                echo "Device: $DEVICE_NAME ($UDID), boot attempt $boot_attempt"
                date -u
                simctl_bounded "list devices after failed boot" 30 list devices available || true
              } >> "$RUNNER_TEMP/athlth-iphone-boot-diagnostics.txt" 2>&1
              if [ "$boot_attempt" -lt 3 ]; then
                simctl_bounded "shutdown unresponsive $DEVICE_NAME" 35 shutdown "$UDID" || true
                if [ "$boot_attempt" -eq 2 ]; then
                  # Recreate only this job's device; avoid global service kills
                  # that can interrupt other workflows on a shared runner.
                  cleanup_device "$UDID"
                  UDID=""
                  UDID=$(create_isolated_device "$DEVICE_UDID")
                fi
                sleep 10
              fi
            done
            if [ "$boot_ready" -ne 1 ]; then
              echo "::error::$DEVICE_NAME remained unresponsive after recovery; no app launch was attempted."
              exit 1
            fi
            simctl_bounded "install ATHLTH $DEVICE_NAME" 155 install "$UDID" "$APP"

            set +e
            LAUNCH_OUTPUT=$(simctl_bounded "launch ATHLTH $DEVICE_NAME" 75 launch "$UDID" com.wesc9.athlth 2>&1)
            LAUNCH_STATUS=$?
            set -e

            echo "$LAUNCH_OUTPUT"

            if [ "$LAUNCH_STATUS" -ne 0 ]; then
              echo "::error::ATHLTH failed to launch on $DEVICE_NAME."
              simctl_bounded "collect ATHLTH failure logs" 65 spawn "$UDID" log show --last 2m --style compact --predicate 'process == "ATHLTH"' || true
              exit 1
            fi

            PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
            sleep 8

            if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::ATHLTH exited shortly after launch on $DEVICE_NAME."
              simctl_bounded "collect ATHLTH failure logs" 65 spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
              exit 1
            fi

            SCREENSHOT="$RUNNER_TEMP/athlth-$CLASS.png"
            if ! validate_nonblank_screen "$UDID" "$SCREENSHOT" "$DEVICE_NAME onboarding" probe; then
              # A headless CoreSimulator framebuffer can remain blank even
              # after a successful process launch on a freshly created device.
              # Reopen the real app once; do not lower the visual threshold or
              # mark a persistently blank screen as a passing result.
              simctl_bounded "terminate ATHLTH $DEVICE_NAME" 35 terminate "$UDID" com.wesc9.athlth || true
              sleep 3
              set +e
              RETRY_LAUNCH_OUTPUT=$(simctl_bounded "launch ATHLTH $DEVICE_NAME" 75 launch "$UDID" com.wesc9.athlth 2>&1)
              RETRY_LAUNCH_STATUS=$?
              set -e
              echo "$RETRY_LAUNCH_OUTPUT"
              if [ "$RETRY_LAUNCH_STATUS" -ne 0 ]; then
                echo "::error::ATHLTH failed to relaunch after blank screenshot on $DEVICE_NAME."
                exit 1
              fi
              PID=$(echo "$RETRY_LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
              sleep 12
              if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
                echo "::error::ATHLTH exited during blank-screen relaunch on $DEVICE_NAME."
                exit 1
              fi
              validate_nonblank_screen "$UDID" "$SCREENSHOT" "$DEVICE_NAME onboarding"
            fi

            echo "ATHLTH remained alive and rendered non-blank onboarding UI on $DEVICE_NAME (PID $PID)."

            simctl_bounded "terminate ATHLTH $DEVICE_NAME" 35 terminate "$UDID" com.wesc9.athlth || true

            # Build 135 crashed only while moving between two already-mounted
            # native tabs. A cold-start screenshot of tab 1 cannot detect it.
            echo "Smoke testing Home -> Train tab switch on $DEVICE_NAME"
            set +e
            HOP_OUTPUT=$(simctl_bounded "launch Home-to-Train $DEVICE_NAME" 75 launch --terminate-running-process "$UDID" com.wesc9.athlth \
              --athlth-compatibility-preview \
              --athlth-compatibility-tab=0 \
              --athlth-smoke-home-train-hop \
              --athlth-smoke-home-train-stress 2>&1)
            HOP_STATUS=$?
            set -e
            echo "$HOP_OUTPUT"
            if [ "$HOP_STATUS" -ne 0 ]; then
              echo "::error::ATHLTH failed to launch for Home -> Train regression."
              exit 1
            fi
            HOP_PID=$(echo "$HOP_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
            # A fresh native process drives the transition only after Home
            # actually appears. Evidence is required before accepting a frame.
            sleep 8
            if [ -z "$HOP_PID" ] || ! kill -0 "$HOP_PID" 2>/dev/null; then
              echo "::error::ATHLTH crashed during Home -> Train transition on $DEVICE_NAME."
              simctl_bounded "collect Home-to-Train crash logs" 65 spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
              exit 1
            fi
            HOP_SCREENSHOT="$RUNNER_TEMP/athlth-$CLASS-home-train.png"
            verify_train_dashboard_ready "$UDID" "$HOP_PID" "$DEVICE_NAME Home-to-Train" true
            validate_nonblank_screen "$UDID" "$HOP_SCREENSHOT" "$DEVICE_NAME Home-to-Train after dashboard mount"
            # Prove all 100 same-process Home -> Train cycles completed.
            STRESS_CONTAINER=$(simctl_bounded "locate Train stress evidence" 45 get_app_container "$UDID" com.wesc9.athlth data)
            # Acknowledge the first verified screenshot before the app begins
            # switching tabs repeatedly, so the first frame is not a Home frame.
            printf 'start\n' > "$STRESS_CONTAINER/tmp/athlth-train-$HOP_PID-native-stress-start"
            STRESS_COMPLETE=false
            for attempt in $(seq 1 420); do
              if ! kill -0 "$HOP_PID" 2>/dev/null; then
                echo "::error::ATHLTH crashed during repeated Train navigation on $DEVICE_NAME."
                exit 1
              fi
              if [ -s "$STRESS_CONTAINER/tmp/athlth-train-$HOP_PID-stress-hop-100" ]; then
                STRESS_COMPLETE=true
                break
              fi
              sleep 1
            done
            if [ "$STRESS_COMPLETE" != true ]; then
              echo "::error::Train stress test did not complete 100 navigation cycles."
              exit 1
            fi
            for hop in $(seq 1 100); do
              test -s "$STRESS_CONTAINER/tmp/athlth-train-$HOP_PID-stress-hop-$hop"
            done
            verify_train_dashboard_ready "$UDID" "$HOP_PID" "$DEVICE_NAME repeated Home-to-Train" true
            validate_nonblank_screen "$UDID" "$HOP_SCREENSHOT" "$DEVICE_NAME after 100 Home-to-Train cycles"
            simctl_bounded "terminate transition app $DEVICE_NAME" 35 terminate "$UDID" com.wesc9.athlth || true

            # Test individual tab cold starts after the native navigation regression.
            for TAB in 0 1 2 3 4; do
              echo "Rendering main tab $TAB on $DEVICE_NAME"

              set +e
              TAB_LAUNCH_OUTPUT=$(simctl_bounded "launch ATHLTH $DEVICE_NAME" 75 launch "$UDID" com.wesc9.athlth \
                --athlth-compatibility-preview \
                "--athlth-compatibility-tab=$TAB" 2>&1)
              TAB_LAUNCH_STATUS=$?
              set -e

              echo "$TAB_LAUNCH_OUTPUT"

              if [ "$TAB_LAUNCH_STATUS" -ne 0 ]; then
                echo "::error::ATHLTH tab $TAB failed to launch on $DEVICE_NAME."
                exit 1
              fi

              TAB_PID=$(echo "$TAB_LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
              sleep 5

              if [ -z "$TAB_PID" ] || ! kill -0 "$TAB_PID" 2>/dev/null; then
                echo "::error::ATHLTH tab $TAB exited on $DEVICE_NAME."
                simctl_bounded "collect ATHLTH failure logs" 65 spawn "$UDID" log show --last 3m --style compact --predicate 'process == "ATHLTH" OR eventMessage CONTAINS "com.wesc9.athlth"' || true
                exit 1
              fi

              TAB_SCREENSHOT="$RUNNER_TEMP/athlth-$CLASS-tab-$TAB.png"
              if ! validate_nonblank_screen "$UDID" "$TAB_SCREENSHOT" "$DEVICE_NAME tab $TAB" probe; then
                # A reused headless CoreSimulator can preserve a stale blank
                # framebuffer between previews. Reopen this exact tab once;
                # still fail if it does not render a real nonblank frame.
                echo "::warning::Retrying blank $DEVICE_NAME tab $TAB after a fresh launch."
                simctl_bounded "terminate ATHLTH $DEVICE_NAME" 35 terminate "$UDID" com.wesc9.athlth || true
                sleep 3
                set +e
                TAB_RETRY_LAUNCH_OUTPUT=$(simctl_bounded "launch ATHLTH $DEVICE_NAME" 75 launch "$UDID" com.wesc9.athlth \
                  --athlth-compatibility-preview \
                  "--athlth-compatibility-tab=$TAB" 2>&1)
                TAB_RETRY_LAUNCH_STATUS=$?
                set -e
                echo "$TAB_RETRY_LAUNCH_OUTPUT"
                if [ "$TAB_RETRY_LAUNCH_STATUS" -ne 0 ]; then
                  echo "::error::ATHLTH tab $TAB failed to relaunch on $DEVICE_NAME."
                  exit 1
                fi
                TAB_PID=$(echo "$TAB_RETRY_LAUNCH_OUTPUT" | awk -F': ' '/com\.wesc9\.athlth:/ {print $2}')
                sleep 12
                if [ -z "$TAB_PID" ] || ! kill -0 "$TAB_PID" 2>/dev/null; then
                  echo "::error::ATHLTH tab $TAB exited after relaunch on $DEVICE_NAME."
                  exit 1
                fi
                validate_nonblank_screen "$UDID" "$TAB_SCREENSHOT" "$DEVICE_NAME tab $TAB"
              fi

              if [ "$TAB" -eq 1 ]; then
                verify_train_dashboard_ready "$UDID" "$TAB_PID" "$DEVICE_NAME Train"
                validate_nonblank_screen "$UDID" "$TAB_SCREENSHOT" "$DEVICE_NAME Train after dashboard mount"
              fi
              simctl_bounded "terminate ATHLTH $DEVICE_NAME" 35 terminate "$UDID" com.wesc9.athlth || true
            done

            echo "All five main tabs rendered on $DEVICE_NAME."

            cleanup_device "$UDID"
            trap - EXIT
          done < "$DEVICE_MATRIX"

      - name: Upload iPhone simulator boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-boot-diagnostics-${{ matrix.size }}
          path: ${{ runner.temp }}/athlth-iphone-boot-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload iPhone smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-smoke-screenshots-${{ matrix.size }}
          path: ${{ runner.temp }}/athlth-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Train transition stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlth-iphone-train-stack-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/athlth-*-train-sample.txt
            ${{ runner.temp }}/athlth-*-train-host.txt
          if-no-files-found: ignore
          retention-days: 7
