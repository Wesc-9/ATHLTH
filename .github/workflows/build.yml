name: Build ATHLTH

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - restore/v1-athlth-plus
      - release/v1.2
      - release/v1.3
      - release/v1.3.1
      - release/v1.3.2
      - release/v1.3.3
      - release/v1.3.4
    paths:
      - .github/build-trigger
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify committed app icons
        shell: bash
        run: |
          set -euo pipefail
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png
          test -s ATHLTH/Assets.xcassets/AppIcon.appiconset/AppIcon-tinted.png
          test -s ATHLTHWatchApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ATHLTH.xcodeproj \
            -scheme ATHLTH \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
